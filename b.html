<style>
:root { --accent: #FF5A36; --ink: #100F12; --paper: #F4F1EA; --muted: #9a9da5; }
/* WrapRuntime styles — the player stage, card flip mechanics, and every
 * rendered component. Shared by all pages; page chrome lives in each page. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #000; }
html, body { overscroll-behavior: none; }

.player-stage {
  position: fixed; inset: 0; margin: 0; background: #000;
  display: grid; place-items: center;
  font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
}
.player-stage[hidden] { display: none; }
.screen {
  position: relative;
  width: min(100vw, calc(100vh * 640 / 910));
  aspect-ratio: 640 / 910;
  background: #000; overflow: hidden;
  /* all gestures are ours: horizontal flips and the vertical
   * action-sheet swipe — browser panning would pointercancel them */
  touch-action: none;
  /* swiping must never select card text */
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
/* Modern phones are much taller than the 640×910 design canvas — fill the
 * whole screen and let the card background absorb the extra height; the
 * runtime centers the canvas vertically (rescale in runtime.js). */
@media (max-aspect-ratio: 640/910) {
  .screen { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; }
}

/* ---- WRAP card mechanics (values from wrap.co/wraps/main.css) ---- */
.card-container {
  position: absolute; inset: 0; background: #000;
  perspective: 2000px; perspective-origin: left center;
}
.card {
  position: absolute; inset: 0; overflow: hidden;
  transform-origin: 0 0; transform: rotateY(0deg);
  transition: transform 0.7s cubic-bezier(0.26, 0.65, 0.37, 1.07);
  will-change: transform; background: #fff;
}
.card.turned { transform: rotateY(-90deg); }
.card .fold {
  position: absolute; inset: 0; z-index: 990; pointer-events: none;
  background: linear-gradient(100deg, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 60%);
  opacity: 0; transition: opacity 0.7s cubic-bezier(0.26, 0.65, 0.37, 1.07);
}
.card.turned .fold { opacity: 1; }
@keyframes bounceCardHintAnimation {
  0%, 40%, 57%, 100% { animation-timing-function: cubic-bezier(0.215,0.61,0.355,1); transform: rotateY(0rad); }
  30% { animation-timing-function: cubic-bezier(0.755,0.05,0.855,0.06); transform: rotateY(-0.6rad); }
  50% { animation-timing-function: cubic-bezier(0.755,0.05,0.855,0.06); transform: rotateY(-0.2rad); }
}
.card.animate-swipe-hint { animation: 1.9s 2s 1 bounceCardHintAnimation; }

.canvas { position: absolute; top: 0; left: 0; width: 640px; height: var(--canvas-h, 910px); transform-origin: 0 0;
  /* Fraunces carries an opsz axis (verified in the embedded subset) —
   * keep optical sizing explicit so display cuts sharpen at title sizes */
  font-optical-sizing: auto; }
.canvas p { margin: 0 0 0.4em; }
.canvas p:last-child { margin-bottom: 0; }

/* ---- rendered components ---- */
.cmp { position: absolute; margin: 0; }
.cmp-image { overflow: hidden; }
.img-ph { position: absolute; inset: 0; display: grid; place-items: center; }
/* generated photograph over its duotone placeholder, fading in on load */
.img-real {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0; transition: opacity 0.6s ease;
}
.img-real.loaded { opacity: 1; }
/* palette tone-map: rides above the photo, invisible until it loads */
.img-tone {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  mix-blend-mode: color; opacity: 0; transition: opacity 0.8s ease;
}
.img-real { z-index: 1; }
.cmp-image:has(.img-real.loaded) .img-tone { opacity: 0.24; }
/* ---- motion system: each rule gated by a flag class on .screen ---- */
/* Ken Burns: the current card's photo drifts, slow and alive */
@keyframes kenBurns {
  from { transform: scale(1); }
  to { transform: scale(1.045); }
}
.m-kb .card.current .img-real.loaded { animation: kenBurns 26s ease-in-out infinite alternate; }
/* photo settle: a loaded picture eases down from a slight zoom */
.m-settle .img-real { transform: scale(1.05); transition: opacity 0.6s ease, transform 1.4s ease; }
.m-settle .img-real.loaded { transform: scale(1); }
/* drag parallax: type lags the photo while the page turns */
.m-par .card.is-dragging .canvas > .cmp:not(.cmp-image):not(.cmp-gradation):not(.cmp-veil):not(.cmp-outline) {
  transform: translateX(var(--par, 0px));
}
/* a whisper of shadow keeps type legible when a pale photograph fights

.canvas > .cmp-image ~ .cmp { text-shadow: 0 1px 24px rgba(0, 0, 0, 0.35); }
/* quote attributions step down and apart from the quotation itself */

/* editorial drop cap on left-set prose */
.dropcap {

.cmp-end p { color: #fff; font-weight: 500; font-style: italic; font-size: 30px; margin: 5px 0; font-family: 'Fraunces', Georgia, serif; max-width: 85%; text-wrap: balance; }
.cmp-end .end-colophon {

}

/* ---- galleries ---- */
.cmp-gallery { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory; scrollbar-width: none; }

.gallery-hint {

@keyframes hintBob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* ---- player chrome ---- */
.pagination-track { position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
  background: #000; z-index: 1000; pointer-events: none; overflow: hidden; }
.pagination-track .current-page { position: absolute; height: 100%; background: var(--accent); transition: left 0.12s ease-out; }
.pv-btn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 995;
  width: 46px; height: 70px; border: none; background: transparent; cursor: pointer;
  color: #fff; opacity: 0.15; transition: opacity 0.25s ease-out;
  display: grid; place-items: center; padding: 0;
}
.pv-btn:hover, .pv-btn:focus-visible { opacity: 0.9; }
.pv-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
.pv-btn[hidden] { display: none; }
.pv-btn.prev { left: 2px; } .pv-btn.next { right: 2px; }
.pv-btn svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
/* phones flip by dragging or tapping the edges — hide the desktop chevrons */
@media (max-width: 640px), (hover: none) and (pointer: coarse) {
  .pv-btn { display: none; }
}
.tap-zone { position: absolute; top: 60px; bottom: 40px; width: 15%; z-index: 960; cursor: pointer; }
.tap-zone.left { left: 0; } .tap-zone.right { right: 0; }

@media (prefers-reduced-motion: reduce) {
  .card, .card .fold { transition: none; }
  .card.animate-swipe-hint, .gallery-hint { animation: none; }
  /* the ambient motion system rests too: no drift, no settle, no breathing */
  .m-kb .card.current .img-real.loaded { animation: none; }
  .m-settle .img-real { transform: none; transition: opacity 0.6s ease; }
  .img-ph span { animation: none; opacity: 0.8; }
  .m-par .card.is-dragging .canvas > .cmp:not(.cmp-image):not(.cmp-gradation):not(.cmp-veil):not(.cmp-outline) { transform: none; }
}

/* Player chrome shared by the composer and the viewer: corner pills on
 * desktop, a swipe-up pull-up action sheet on phones. Each page provides
 * a .chrome bar (with .back-btn actions, the muted one marked .quiet),
 * plus a .share-toast; the sheet gestures live in each page's script. */
.back-btn {
  position: absolute; top: 10px; left: 10px; z-index: 1010;
  background: rgba(0,0,0,0.45); color: #fff; border: none; border-radius: 999px;
  font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.06em;
  padding: 8px 14px; cursor: pointer; opacity: 0.55; transition: opacity 0.2s;
  text-decoration: none; text-align: center;
}
.back-btn:hover, .back-btn:focus-visible { opacity: 1; }
/* desktop: the chrome container is transparent — pills sit in the corners */
.chrome { display: contents; }
.pv-actions { position: absolute; top: 10px; right: 10px; z-index: 1010; display: flex; gap: 6px; }
.pv-actions .back-btn { position: static; }

/* phones: actions live in a pull-up sheet — swipe up on the book to open */
@media (max-width: 640px), (hover: none) and (pointer: coarse) {
  /* open sheet: the book recedes — scaled, dimmed, rounded like a card */
  .card-container { transition: transform 0.28s ease, filter 0.28s ease, border-radius 0.28s ease; }
  .screen.sheet-open .card-container {
    transform: scale(0.93);
    transform-origin: 50% 40%;
    filter: brightness(0.5) saturate(0.9);
    border-radius: 20px; overflow: hidden;
  }
  .chrome {
    touch-action: none; /* we handle vertical drags — stop browser panning */
    display: flex; flex-direction: column; gap: 10px;
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1022;
    background: #101114;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5);
    padding: 26px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 0.25s ease;
  }
  .chrome::before { /* grab bar */
    content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 4px; border-radius: 999px; background: rgba(244,241,234,0.3);
  }
  .chrome.open { transform: translateY(0); }
  /* first-run affordance: the grab bar peeks over the bottom edge until
   * the sheet has been discovered once (see hintSheet in the pages) */
  .chrome.peek { transform: translateY(calc(100% - 26px)); }
  .chrome .back-btn, .pv-actions .back-btn {
    position: static; width: 100%; opacity: 1;
    background: rgba(255,255,255,0.08); font-size: 14px; padding: 15px;
    border-radius: 10px;
  }
  .pv-actions { position: static; display: contents; }
  .chrome .quiet { order: 4; background: none; color: var(--muted, #9a9da5); }
  /* the toast clears the home-indicator area (specificity beats the later base rule) */
  .screen .share-toast { bottom: calc(26px + env(safe-area-inset-bottom)); }
}

  z-index: 1030; max-width: 88%; /* transient — wins over all player chrome */
  background: rgba(0,0,0,0.8); color: #fff; border-radius: 10px;

<script>
/* BookRuntime — shared renderer + flip engine for all BOOK pages.
 * Single source of truth: consumed by index.html (composer) and player.html (library).
 * Node vocabulary is the union of the two producers:
 *   - reverse-engineered wrap.co JSON (player): textbox, image(url), box, gallery,
 *     button(css content label), action, location, youtube, widget, flow, background, end
 *   - the story compiler (composer): image(hue/lbl), gradation, veil, outline,
 *     textbox, button(label), action, youtube, map, gallery, end
 */
(function (global) {
  'use strict';

  var GRADATION_ASSET = '26e27ad1';   /* wrap.co's shared dark-gradient overlay PNG */
  var OUTLINE_ASSET   = '66f61527';   /* wrap.co's shared white outline-frame PNG  */

  /* ---------- helpers ---------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Only allow safe link schemes — model- or JSON-supplied URLs must never
   * become javascript:/data: sinks (they'd run with access to localStorage). */
  function safeUrl(url) {
    if (typeof url !== 'string') return null;
    var u = url.trim();
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
    return null;
  }

  function applyCss(el, css) {
    if (!css) return;
    for (var k in css) {
      if (k === 'content') continue; /* button labels ride in css.content; render() reads it as text */
      el.style.setProperty(k, css[k]);
    }
    if (!css.position || css.position !== 'absolute') el.style.position = 'absolute';
  }

  /* Solid ink tone for an image slot awaiting its photograph — the page
   * design is gradient-free; h2 rides along only for stored-story compat. */
  function grad(h1, h2) {
    return 'hsl(' + h1 + ', 22%, 17%)';
  }

  /* Logical canvas height for the adaptive canvas: follows the viewport
   * aspect, clamped between the classic 910 and a modern tall phone. */
  function canvasHeight() {
    var w = global.innerWidth || 640, h = global.innerHeight || 910;
    return Math.max(910, Math.min(1390, Math.round(640 * h / w)));
  }

  /* Real photographs live behind our own /api/images/ ids (or https, for
   * future CDN serving) — anything else stays a duotone placeholder. */
  function imageSrc(url) {
    if (typeof url !== 'string') return null;
    var u = url.trim();
    if (/^https:\/\//i.test(u) || /^\/api\/images\//.test(u)) return u;
    return null;
  }

  /* Lay a real image over a slot's duotone placeholder; it fades in on
   * load, so books are viewable the instant the placeholders render.
   * Called at render time (stored urls) and by the composer's fan-out
   * as freshly generated images land. */
  function attachImage(el, url) {
    var src = imageSrc(url);
    if (!src || el.querySelector('.img-real')) return;
    var im = document.createElement('img');

  /* ---------- player factory: flip mechanics (verbatim from wrap.co main.css) ---------- */
  /* opts: { screen, container, prevBtn, nextBtn, pageBar, tapLeft, tapRight,
   *         keyGate()  -> bool   (should arrow keys act right now)
   *         onLoaded(book)       (page hook: set title, chrome, ...) }        */

  function createPlayer(opts) {
    var screenEl = opts.screen, container = opts.container;

       * background fills the rest */

      nextBtn.hidden = current === total - 1;

       * toolbar) and tint them from theme-color / the page background.
       * Painting both with the current card's color makes the book bleed
       * into them instead of sitting between black bars. */
      var bg = cards[current] && cards[current].style.background;
      if (bg) {
        var stage = screenEl.parentElement;
        if (stage) stage.style.background = bg;
        document.body.style.background = bg;
        document.documentElement.style.background = bg;

      (w.cards || []).forEach(function (cardNode, i) {
        var card = document.createElement('section');
        card.className = 'card';
        card.style.zIndex = String(500 - i);
        var bg = cardNode.bg || (cardNode.css && cardNode.css['background-color']);
        if (bg) card.style.background = bg;
        var canvas = document.createElement('div');
        canvas.className = 'canvas';
        (cardNode.k || []).forEach(function (ch) { render(ch, canvas, ctx); });
        card.appendChild(canvas);
        var fold = document.createElement('div');
        fold.className = 'fold';
        card.appendChild(fold);

      cards[0].classList.add('animate-swipe-hint');
      cards[0].addEventListener('animationend', function () {

      });

    api.showCard = function (i) { current = Math.max(0, Math.min(total - 1, i)); update(); };
    api.cardCount = function () { return total; };

    nextBtn.addEventListener('click', function () { go(1); });
    prevBtn.addEventListener('click', function () { go(-1); });
    if (opts.tapRight) opts.tapRight.addEventListener('click', function () { go(1); });
    if (opts.tapLeft) opts.tapLeft.addEventListener('click', function () { go(-1); });

    var drag = null;

       * swallows the click below, so taps alone open the map */
      var link = e.target.closest('a');
      if (link && !link.classList.contains('cmp-map')) return;
      if (opts.dragGate && !opts.dragGate()) return;

    }
    screenEl.addEventListener('click', function (e) {
      if (swallowClick) {
        swallowClick = false;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);
    screenEl.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.mode) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 10) return;
        if (Math.abs(dx) <= Math.abs(dy)) { drag.mode = 'v'; } // vertical → the page hook (action sheet)
        else {
          drag.mode = 'h';
        }
      }
      if (drag.mode === 'v') {
        if (dy < -40) {
          drag = null;
          armSwallow();
          if (opts.onSwipeUp) opts.onSwipeUp();
        }
        return;
      }
      if (drag.mode === 'h' && !drag.card) {
        drag.fwd = dx < 0;
        if (!drag.fwd && current === 0) { drag = null; return; }
        drag.card = drag.fwd ? cards[current] : cards[current - 1];
        drag.card.classList.add('is-dragging');
        drag.card.style.transition = 'none';
        var f0 = drag.card.querySelector('.fold');
        if (f0) f0.style.transition = 'none';

      var w = screenEl.clientWidth, rot;
      if (drag.fwd) {

      } else {
        rot = Math.min(0, Math.max(-90, -90 + dx / w * 110));
      }
      drag.card.style.transform = 'rotateY(' + rot + 'deg)';
      /* type lags the photo a touch — depth while the page turns */
      drag.card.style.setProperty('--par', Math.round(dx * 0.07) + 'px');
      var fd = drag.card.querySelector('.fold');
      if (fd) fd.style.opacity = String(Math.min(1, -rot / 90));
      drag.dx = dx;
    });
    function endDrag() {
      if (!drag) return;
      if (drag.mode === 'h' && drag.card) {
        if (Math.abs(drag.dx) > 10) armSwallow();
        var w = screenEl.clientWidth;
        var commit = Math.abs(drag.dx) > w * 0.18;
        drag.card.style.transition = '';
        var fd = drag.card.querySelector('.fold');
        if (fd) { fd.style.transition = ''; fd.style.opacity = ''; }
        drag.card.style.transform = '';
        drag.card.style.removeProperty('--par');
        drag.card.classList.remove('is-dragging');
        if (commit) {
          if (drag.fwd && current < total - 1) current += 1;
          else if (!drag.fwd && current > 0) current -= 1;

        }

      }
      drag = null;
    }
    screenEl.addEventListener('pointerup', endDrag);
    screenEl.addEventListener('pointercancel', endDrag);

    return api;
  }

  global.BookRuntime = {
    render: render,
    createPlayer: createPlayer,
    canvasHeight: canvasHeight,
    escapeHtml: escapeHtml,
    safeUrl: safeUrl,
    imageSrc: imageSrc,
    attachImage: attachImage,
    applyCss: applyCss,
    grad: grad,
    hashHue: hashHue

<script>
/* BookChrome — page plumbing shared by the composer, viewer, and editor.
 * One source for the pieces that used to be copy-pasted per page:
 *   - apiFetch: long-call host first (no ~45s cap), same-origin fallback
 *   - isPhone:  the sheet/gesture breakpoint, matching chrome.css
 *   - toaster:  a toast function bound to a page's .share-toast element
 *   - sheet:    the pull-up action sheet — open/close with focus and the
 *               first-run peek hint, scrim dismissal, drag-down dismissal
 * Inlined by build.py, so the LONG_API token resolves here too. */
(function (global) {
  'use strict';

  /* Story and image generation run long; SWA severs responses at ~45s.
   * A standalone Functions app (baked in at build time from the LONG_API
   * file) hosts the same API without that cap. Try it first and fall
   * back to same-origin when it's unreachable or not yet deployed —
   * the site keeps working on managed functions alone. */
  var LONG_API = 'https://image-flow-book-hpcuehhccbb2chcg.westus2-01.azurewebsites.net';
  async function apiFetch(path, opts) {
    if (LONG_API) {
      try {
        var r = await fetch(LONG_API + path, opts);
        if (r.status !== 404) return r;
      } catch (e) { /* CORS not set / app down — same-origin still works */ }
    }
    return fetch(path, opts);
  }

  function isPhone() {
    return global.matchMedia('(max-width: 640px), (hover: none) and (pointer: coarse)').matches;
  }

  /* toast(html, sticky) bound to one element; non-sticky fades in 8s */
  function toaster(el) {
    var timer = null;
    return function toast(html, sticky) {
      el.innerHTML = html;
      el.hidden = false;
      clearTimeout(timer);
      if (!sticky) timer = setTimeout(function () { el.hidden = true; }, 8000);
    };
  }

  /* The phone action sheet. bar = the .chrome element, screenNode = the
   * player .screen it sits over. Returns { set, hint, isOpen }. */
  function sheet(bar, screenNode) {
    function set(open) {
      bar.classList.remove('peek');
      bar.classList.toggle('open', open);
      /* the book pushes back and locks while the sheet is up */
      screenNode.classList.toggle('sheet-open', open);
      if (open) {
        try { localStorage.setItem('book.sheetHinted', '1'); } catch (e) {}
        var first = bar.querySelector('button:not([hidden])');
        if (first && isPhone()) first.focus();
      }
    }

    /* first book on a phone: the grab bar peeks so the sheet is discoverable */
    function hint() {
      if (!isPhone()) return;
      try { if (localStorage.getItem('book.sheetHinted')) return; } catch (e) {}
      bar.classList.add('peek');
      setTimeout(function () { bar.classList.remove('peek'); }, 2800);
    }

    /* using one of the sheet's actions closes it */
    bar.addEventListener('click', function (e) {
      if (e.target.closest('button') || e.target.closest('a')) set(false);
    });

    /* the dimmed book is a scrim: any touch on it — tap or sideways
     * swipe — dismisses the sheet instead of flipping pages */
    var scrimDismissed = false;
    screenNode.addEventListener('pointerdown', function (e) {
      scrimDismissed = false;
      if (!bar.classList.contains('open')) return;
      if (e.target.closest('.chrome')) return;
      set(false);
      scrimDismissed = true;
      e.stopPropagation(); /* the player never sees it — no flip, no drag */
    }, true);
    screenNode.addEventListener('click', function (e) {
      if (scrimDismissed) {
        scrimDismissed = false;
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);

    /* swipe: drag the open sheet down to dismiss */
    var drag = null;
    bar.addEventListener('pointerdown', function (e) {
      if (bar.classList.contains('open')) drag = { y: e.clientY, moved: false };
    });
    bar.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dy = e.clientY - drag.y;
      if (dy > 6 && !drag.moved) {
        drag.moved = true;
        /* capture so the drag survives crossing overlays (e.g. the toast) */
        try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (drag.moved) {
        bar.style.transition = 'none';
        bar.style.transform = 'translateY(' + Math.max(0, dy) + 'px)';
      }
    });
    function end(e) {
      if (!drag) return;
      var dy = e.clientY - drag.y;
      bar.style.transition = '';
      bar.style.transform = '';
      if (drag.moved && dy > 55) set(false);
      drag = null;
    }
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);

    return {
      set: set,
      hint: hint,
      isOpen: function () { return bar.classList.contains('open'); }
    };
  }

  global.BookChrome = { apiFetch: apiFetch, isPhone: isPhone, toaster: toaster, sheet: sheet };
})(window);

</script>
<script>
/* BookCompiler — semantic story cards → primitive layout nodes.
 * The generation contract lives here in one place: the JSON schema the model
 * must emit (STORY_SCHEMA), the prompt that teaches it the card types
 * (SYSTEM_PROMPT), the compiler that maps those cards onto the layouts
 * reverse-engineered from real wrap.co examples, and a schema-exercising SAMPLE.
 * Depends on BookRuntime (escapeHtml). */
(function (global) {
  'use strict';

  var escapeHtml = global.BookRuntime.escapeHtml;

  function fitFont(text, base, perChar) {
    var len = (text || '').length;
    if (len <= perChar) return base;
    /* floor 34: a shrunken title must never fall below quote size, or
     * the page's hierarchy inverts against 27px body text */
    return Math.max(34, Math.round(base * perChar / len));
  }
  function num(v, d) { var n = parseInt(v, 10); return isNaN(n) ? d : ((n % 360) + 360) % 360; }
  /* slot is the image's address in the story ("3" = card 3, "2.1" =
   * gallery card 2 item 1) — how the API's image fan-out targets it.
   * image.url is set server-side once a photograph is generated. */
  function img(css, image, slot) {
    image = image || {};
    return {
      t: 'image', css: css, hue: [num(image.h1, 220), num(image.h2, 260)],
      lbl: image.label || '', url: image.url || '', slot: slot
    };
  }
  function tb(text, css) { return { t: 'textbox', text: text, css: css }; }

  /* Typographic punctuation: curly quotes, em dashes, real ellipses —
   * applied to every human-readable string before it reaches a page. */
  function smarten(s) {
    return String(s == null ? '' : s)
      .replace(/---?/g, '\u2014')
      .replace(/\.\.\./g, '\u2026')
      .replace(/(^|[\s([{\u2014"])'/g, '$1\u2018')
      .replace(/'/g, '\u2019')
      .replace(/(^|[\s([{\u2014])"/g, '$1\u201C')
      .replace(/"/g, '\u201D');
  }

  /* Editorial drop cap for left-set prose: the first letter, oversized. */
  function dropCap(text) {
    var m = /^([\u2018\u201C]?)([A-Za-z])([\s\S]*)$/.exec(text);
    if (!m) return escapeHtml(text);
    return escapeHtml(m[1]) + '<span class="dropcap">' + escapeHtml(m[2]) + '</span>' + escapeHtml(m[3]);
  }

  var MONT = "'Montserrat', sans-serif", SLAB = "'Josefin Slab', Georgia, serif", OPEN = "'Open Sans', sans-serif";
  var FRAUNCES = "'Fraunces', Georgia, serif";
  var WHITE = 'rgba(253,254,255,1)';

  /* ---------- the type ramp ----------
   * Every size on a page comes from this scale: Fraunces carries display
   * and titles, Montserrat small tracked caps carries labels, Josefin
   * Slab carries reading text. fitFont shrinks a step for long copy but
   * always starts from a ramp value. */
  var RAMP = {
    display: 76,  // cover title
    title: 54,    // card titles
    gtitle: 44,   // gallery item titles
    quote: 34,    // quote lines — a clear step above body, or quote pages read flat
    body: 27,     // prose body
    small: 24,    // gallery/video body
    kicker: 15,   // tracked caps labels
    caption: 13   // attributions, gallery kickers
  };

  function typo(top, size, family, opts) {
    opts = opts || {};
    var css = {
      position: 'absolute', top: top + 'px', left: (opts.left != null ? opts.left : 0) + 'px',
      width: (opts.width != null ? opts.width : 640) + 'px',
      'text-align': opts.align || 'center', color: WHITE, 'font-family': family,
      'font-size': size + 'px', 'line-height': String(opts.lh || 1.1),
      'padding-top': '10px', 'padding-bottom': '10px', 'z-index': '10'
    };
    if (opts.weight) css['font-weight'] = String(opts.weight);
    if (opts.ls) css['letter-spacing'] = opts.ls;
    /* tracked caps set centered drift optically left (the last glyph's
     * trailing letter-space counts as line width) — a matching text-indent
     * rebalances them */
    if (opts.ls && (opts.align || 'center') === 'center') css['text-indent'] = opts.ls;
    if (opts.caps) css['text-transform'] = 'uppercase';
    /* modern text wrapping: balance kills one-word second lines on
     * titles; pretty kills widows in reading text (older browsers ignore) */
    if (opts.wrap) css['text-wrap'] = opts.wrap;
    return css;
  }
  function ext(a, b) {
    var o = {}, key;
    for (key in a) o[key] = a[key];
    for (key in b) o[key] = b[key];
    return o;
  }
  /* Card background for full-bleed image cards: a deep tone of the image's
   * primary hue, so the screen-fill area on tall phones blends with the
   * image instead of showing hard seams. */
  function inkBg(image) {
    return 'hsl(' + num(image && image.h1, 220) + ', 30%, 10%)';
  }

  /* ---------- seeded default art direction ----------
   * When the model leaves a card undirected (layout null), the default
   * still varies: a stable hash of the book's name walks a short set of
   * editorial recipes, stepping so consecutive undirected cards never
   * land on the same one. The same book always compiles the same way —
   * variety without randomness — and a directed card is never overridden. */
  var UNDIRECTED = {
    prose: [
      {},                                 /* the classic: middle, centered */
      { band: 'bottom', align: 'left' },
      { band: 'top', align: 'left' },
      { band: 'top' },
      { band: 'bottom' },
      { band: 'middle', align: 'left' }
    ],
    quote: [
      {},                                 /* the classic: middle, centered */
      { band: 'top' },
      { band: 'bottom', align: 'left' }
    ]
  };
  function seedOf(s) {
    var h = 0; s = String(s || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
    return h;
  }
  function defaultLayout(t, seed, idx) {
    var recipes = UNDIRECTED[t];
    if (!recipes) return {};
    var step = 1 + seed % (recipes.length - 1); /* never 0 mod length: neighbors always differ */
    return recipes[(seed + idx * step) % recipes.length];
  }

  /* ---------- the adaptive canvas + model art direction ----------
   * Layouts are anchored bands, not fixed coordinates. The logical canvas
   * is 640 wide and H tall (910 classic, up to 1390 on a tall phone).
   *   top(y)  — fixed distance from the top edge
   *   mid(y)  — the element group stays optically centered
   *   bot(y)  — fixed distance from the bottom edge (y as designed at 910)
   * The model may art-direct each card with layout {band, align, scale}:
   * band picks which anchor the text cluster hangs from, align switches
   * the column, scale steps the title along the ramp. Null means the
   * classic default for that card type. */
  function compileCard(c, H, idx, seed, inkHue) {
    var k = [];
    var t = c.type;
    var slot = String(idx);
    /* pic null → a type-only ink page: no photograph, no scrim, the type
     * sits on deep ink in the hue of the last photographed page so the
     * book stays one color story */
    var pic = c.image || null;
    var ink = 'hsl(' + (inkHue == null ? 220 : inkHue) + ', 26%, 11%)';
    var title = smarten(c.title), body = smarten(c.body), kicker = smarten(c.kicker);
    var midShift = Math.round((H - 910) / 2);
    var botShift = H - 910;
    function mid(y) { return y + midShift; }
    function bot(y) { return y + botShift; }
    var FULL = { position: 'absolute', top: '0px', left: '0px', width: '640px', height: H + 'px' };

    var L = c.layout || {};
    if (L.band == null && L.align == null && L.scale == null) L = defaultLayout(t, seed, idx);
    var scaleMul = L.scale === 'loud' ? 1.2 : L.scale === 'quiet' ? 0.82 : 1;
    var aOpts = L.align === 'left' ? { align: 'left', left: 44, width: 552 } : {};
    /* bands: designed-at-910 cluster origins per band; d = the default band */
    function origin(bands) {
      var band = L.band || bands.d;
      var y = bands[band] != null ? bands[band] : bands[bands.d];
      return band === 'top' ? y : band === 'middle' ? mid(y) : bot(y);
    }

    if (t === 'cover') {
      if (pic) {
        k.push(img(FULL, pic, slot));
        k.push({ t: 'gradation', css: FULL });
      }
      var dsize = Math.round(RAMP.display * scaleMul);
      var tsize = fitFont(title, dsize, 12);
      var O = origin({ top: 110, middle: 360, bottom: 590, d: 'bottom' });
      k.push(tb(escapeHtml(title), typo(O + (dsize - tsize), tsize, FRAUNCES, ext({ left: 31, width: 580, lh: 1.04, weight: 550, wrap: 'balance' }, aOpts))));
      if (kicker) k.push(tb(escapeHtml(kicker), typo(O + (dsize - tsize) + Math.round(tsize * 1.2) + 30, RAMP.kicker, MONT, ext({ ls: '0.3em', caps: 1, lh: 1.6 }, aOpts))));
      return { bg: pic ? inkBg(pic) : ink, k: k };
    }
    if (t === 'quote') {
      if (pic) {
        k.push(img(FULL, pic, slot));
        k.push({ t: 'veil', css: FULL });
      }
      var lines = (c.lines || []).map(function (l) { return escapeHtml(smarten(l)); });
      if (c.attribution) lines.push('<i class="q-attr">— ' + escapeHtml(smarten(c.attribution)) + '</i>');
      var qO = origin({ top: 110, middle: title ? 120 : 200, bottom: title ? 380 : 470, d: 'middle' });
      if (title) k.push(tb(escapeHtml(title), typo(qO, Math.round(40 * scaleMul), FRAUNCES, ext({ weight: 550, wrap: 'balance' }, aOpts))));
      k.push(tb('<p>' + lines.join('<br>') + '</p>',
        typo(qO + (title ? 120 : 0), lines.length > 10 ? RAMP.body : RAMP.quote, SLAB, ext({ left: 80, width: 480, lh: 1.55, wrap: 'pretty' }, aOpts))));
      return { bg: pic ? inkBg(pic) : ink, k: k };
    }
    if (t === 'prose') {
      if (pic) {
        k.push(img(FULL, pic, slot));
        k.push({ t: 'veil', css: FULL });
      }
      var psize = fitFont(title, Math.round(RAMP.title * scaleMul), 16);
      var pO = origin({ top: 100, middle: kicker ? 150 : 170, bottom: 460, d: 'middle' });
      if (kicker) k.push(tb(escapeHtml(kicker), typo(pO, RAMP.kicker, MONT, ext({ ls: '0.3em', caps: 1 }, aOpts))));
      k.push(tb(escapeHtml(title), typo(pO + (kicker ? 46 : 0), psize, FRAUNCES, ext({ left: 30, width: 580, lh: 1.08, weight: 550, wrap: 'balance' }, aOpts))));
      k.push(tb(L.align === 'left' && body.length > 90 ? dropCap(body) : escapeHtml(body),
        typo(pO + (kicker ? 46 : 0) + Math.round(psize * 1.25) + 42, body.length > 330 ? RAMP.small : RAMP.body, SLAB, ext({ left: 60, width: 520, lh: 1.52, wrap: 'pretty' }, aOpts))));
      return { bg: pic ? inkBg(pic) : ink, k: k };
    }
    if (t === 'product') {
      if (pic) {
        k.push(img(FULL, pic, slot));
        k.push({ t: 'gradation', css: FULL });
      }
      var prsize = fitFont(title, Math.round(50 * scaleMul), 18);
      var prO = origin({ top: 120, middle: 320, bottom: 540, d: 'bottom' });
      if (kicker) k.push(tb(escapeHtml(kicker), typo(prO, RAMP.kicker, MONT, ext({ ls: '0.3em', caps: 1 }, aOpts))));
      k.push(tb(escapeHtml(title), typo(prO + 46, prsize, FRAUNCES, ext({ left: 30, width: 580, weight: 550, wrap: 'balance' }, aOpts))));
      var pbody = escapeHtml(body) + (c.price ? ' <b>' + escapeHtml(c.price) + '</b>' : '');
      k.push(tb(pbody, typo(prO + 128, RAMP.body - 1, SLAB, ext({ left: 60, width: 520, lh: 1.4, wrap: 'pretty' }, aOpts))));
      if (c.button) {
        k.push({ t: 'button', label: (c.button || '').toUpperCase(), css: {
          position: 'absolute', top: (prO + 252) + 'px', left: '100px', width: '440px', height: '68px',
          color: '#fff', border: '3px solid #fff', 'font-family': MONT, 'font-size': '21px',
          'font-weight': '600', 'letter-spacing': '0.14em', 'z-index': '20'
        }});
        k.push({ t: 'action', url: c.url || '', css: { position: 'absolute', top: (prO + 248) + 'px', left: '97px', width: '446px', height: '76px' } });
      }
      return { bg: pic ? inkBg(pic) : ink, k: k };
    }
    if (t === 'video') {
      if (pic) {
        k.push(img(FULL, pic, slot));
        k.push({ t: 'veil', css: FULL });
      }
      k.push({ t: 'youtube', url: c.url || '', css: { position: 'absolute', top: mid(355) + 'px', left: '270px', width: '100px', height: '100px', 'z-index': '100' } });
      var vO = origin({ top: 110, middle: 500, bottom: 560, d: 'bottom' });
      if (title) k.push(tb(escapeHtml(title), typo(vO, fitFont(title, Math.round(46 * scaleMul), 18), FRAUNCES, ext({ left: 30, width: 580, weight: 550, wrap: 'balance' }, aOpts))));
      if (body) k.push(tb(escapeHtml(body), typo(vO + 92, RAMP.small, SLAB, ext({ left: 60, width: 520, lh: 1.4, wrap: 'pretty' }, aOpts))));
      return { bg: pic ? inkBg(pic) : ink, k: k };
    }
    if (t === 'map') {
      k.push({ t: 'map', value: c.address || '', css: FULL });
      if (title) k.push(tb(escapeHtml(title), typo(70, fitFont(title, RAMP.title, 16), FRAUNCES, { weight: 550, wrap: 'balance' })));
      return { bg: '#161718', k: k };
    }
    return null;
  }

  /* Vertical scrolling is retired: a stored gallery card flattens into
   * one flip card per moment, keeping the whole book on the horizontal
   * axis. Slot keys stay "i.j" so stored image urls and the fan-out
   * still land on the right page. */
  function compileItemCard(it, H, slot) {
    var botShift = H - 910;
    function bot(y) { return y + botShift; }
    var FULL = { position: 'absolute', top: '0px', left: '0px', width: '640px', height: H + 'px' };
    var k = [];
    k.push(img(FULL, it.image, slot));
    k.push({ t: 'gradation', css: FULL });
    var ikicker = smarten(it.kicker), ititle = smarten(it.title), ibody = smarten(it.body);
    if (ikicker) k.push(tb(escapeHtml(ikicker), typo(bot(555), RAMP.caption, MONT, { ls: '0.3em', caps: 1, left: 30, width: 580 })));
    var isize = fitFont(ititle, RAMP.gtitle, 15);
    k.push(tb(escapeHtml(ititle), typo(bot(615) + (RAMP.gtitle - isize), isize, FRAUNCES, { weight: 550, wrap: 'balance' })));
    if (ibody) k.push(tb(escapeHtml(ibody), typo(bot(700), RAMP.small, SLAB, { left: 45, width: 550, lh: 1.4, wrap: 'pretty' })));
    return { bg: inkBg(it.image), k: k };
  }

  /* opts.height: the logical canvas height (default the classic 910).
   * Pages pass BookRuntime.canvasHeight() so books compile to the
   * viewer's screen; the shelf pins 910 for consistent thumbnails. */
  function compileBook(story, opts) {
    var H = (opts && opts.height) || 910;
    var seed = seedOf(story.name);
    var inkHue = 220; /* type-only pages borrow the last photographed hue */
    var out = { name: smarten(story.name) || 'Untitled', height: H, date: (opts && opts.date) || null, cards: [] };
    (story.cards || []).forEach(function (c, i) {
      c = c || {};
      if (c.type === 'gallery') {
        (c.items || []).slice(0, 5).forEach(function (it, j) {
          out.cards.push(compileItemCard(it || {}, H, i + '.' + j));
        });
        return;
      }
      if (c.image) inkHue = num(c.image.h1, inkHue);
      var compiled = compileCard(c, H, i, seed, inkHue);
      if (compiled) out.cards.push(compiled);
    });
    // end-of-book card, always appended
    out.cards.push({
      bg: '#2e2d2c',
      k: [{ t: 'end', css: { position: 'absolute', top: (Math.round((H - 910) / 2) + 215) + 'px', left: '0px', width: '640px', height: '480px' } }]
    });
    return out;
  }

  /* ---------- the generation contract ---------- */

  /* The generation contract is shared with the server API — single source in api/src/contract/. */
  var STORY_SCHEMA = {
  "type": "object", "additionalProperties": false,
  "required": ["name", "style", "cards"],
  "properties": {
    "name": { "type": "string" },
    "style": { "type": ["string", "null"] },
    "cards": {
      "type": "array",
      "items": {
        "type": "object", "additionalProperties": false,
        "required": ["type", "kicker", "title", "body", "lines", "attribution", "price", "button", "url", "address", "layout", "image", "items"],
        "properties": {
          "type": { "type": "string", "enum": ["cover", "quote", "prose", "product", "video", "map"] },
          "kicker": { "type": ["string", "null"] },
          "title": { "type": ["string", "null"] },
          "body": { "type": ["string", "null"] },
          "lines": { "type": ["array", "null"], "items": { "type": "string" } },
          "attribution": { "type": ["string", "null"] },
          "price": { "type": ["string", "null"] },
          "button": { "type": ["string", "null"] },
          "url": { "type": ["string", "null"] },
          "address": { "type": ["string", "null"] },
          "layout": {
            "type": ["object", "null"], "additionalProperties": false,
            "required": ["band", "align", "scale"],
            "properties": {
              "band": { "anyOf": [{ "type": "string", "enum": ["top", "middle", "bottom"] }, { "type": "null" }] },
              "align": { "anyOf": [{ "type": "string", "enum": ["center", "left"] }, { "type": "null" }] },
              "scale": { "anyOf": [{ "type": "string", "enum": ["quiet", "standard", "loud"] }, { "type": "null" }] }
            }
          },
          "image": {
            "type": ["object", "null"], "additionalProperties": false,
            "required": ["h1", "h2", "label"],
            "properties": {
              "h1": { "type": "integer" }, "h2": { "type": "integer" }, "label": { "type": "string" }
            }
          },
          "items": {
            "type": ["array", "null"],
            "items": {
              "type": "object", "additionalProperties": false,
              "required": ["kicker", "title", "body", "image"],
              "properties": {
                "kicker": { "type": ["string", "null"] },
                "title": { "type": "string" },
                "body": { "type": "string" },
                "image": {
                  "type": ["object", "null"], "additionalProperties": false,
                  "required": ["h1", "h2", "label"],
                  "properties": { "h1": { "type": "integer" }, "h2": { "type": "integer" }, "label": { "type": "string" } }
                }
              }
            }
          }
        }
      }
    }
  }
}
;

  var SYSTEM_PROMPT = ([
  "You are a story designer for BOOK, a mobile flip-book format: a phone-sized stack of full-screen cards the reader swipes through.",
  "Given a story idea, compose a book of 5 to 8 cards using these card types:",
  "- cover: the opening card. title (2-4 words, evocative) + kicker (a one-line subtitle). Always first.",
  "- prose: a narrative beat. kicker (optional small line), title (2-5 words), body (2-4 sentences, warm and concrete).",
  "- quote: a poem, letter excerpt, or meaningful quotation. lines (each line short), attribution (optional). Use at most once.",
  "- product: something offered or celebrated, with a call to action. title, body, optional price (like \"$18\"), button (2-3 words), url (real if given or verified, else null).",
  "- video: only if the user mentions a video or gives a YouTube link. url required.",
  "- map: only if the story has a real place worth visiting. address = the street address or place name. title like \"VISIT US\".",
  "",
  "Accuracy rules - these outrank style:",
  "- Build from the user's details. Never invent facts: no made-up names, dates, addresses, prices, URLs, or historical claims the user didn't give you. You may invent atmosphere (weather, light, small sensory detail) - never verifiable specifics.",
  "- If web search is available and the story involves a real business, venue, event, or public place, search to ground it: the real address for a map card, real hours/prices/URLs for a product card, correct spellings and dates. If you can't verify a fact, leave that field null or omit the card - a smaller true book beats a padded invented one.",
  "- Only attribute a quotation to a real person if it is genuinely theirs. Otherwise attribute it to someone in the story, or leave attribution null.",
  "",
  "Pictures are rationed, not routine: the cover always has an image, and beyond it give photographs only to the two or three strongest moments of the book. Every other card sets image to null and becomes a type-only page - its words set large on deep ink. The quote is almost always strongest as pure typography. A photograph on every page reads like a catalog; the alternation of photo pages and ink pages is the book's rhythm. When a card does carry an image, its label is the brief a photographer would shoot from: 4-8 concrete words naming subject, setting, and light or time of day (e.g. \"weathered lighthouse on a cliff at dusk\", \"flour-dusted hands shaping dough, morning window light\"). Photographable things only - no abstractions, no emotions as subjects, no readable text or signage, no real people's names or likenesses. h1 and h2 are HSL hues 0-359 evoking the scene (the renderer shows a solid ink tone in that hue until the photo arrives - warm 10-50, golden 40-60, green 90-150, teal 170-200, blue 200-250, violet 250-290, rose 300-340).",
  "",
  "Art direction: every card (except map) sets layout = {band, align, scale} to place its type on the page. band: \"top\", \"middle\", or \"bottom\" - where the text block sits over the photo (write the image label so its calm negative space falls in that band). align: \"center\" or \"left\". scale: \"quiet\", \"standard\", or \"loud\" - how large the title speaks. Let the copy motivate the choice: a short declarative line earns loud; a long or tender passage sets quiet or standard, left-aligned, top or bottom; a held-breath moment sits middle center. Rhythm rules for the whole book: direct every card explicitly rather than leaving layout null; no two consecutive cards may repeat the same band+align pair; use at least two different bands and at least one left-aligned page; at most one loud page besides the cover. A well-varied six-card book might run: cover bottom/center/loud → prose top/left/standard → prose bottom/left/quiet → quote middle/center/quiet → product bottom/center/standard → map.",
  "",
  "Also write style: one photographic art-direction line for the whole book - camera or film feel, palette, quality of light (e.g. \"muted 35mm film, overcast coastal light, quiet distances\"). Every picture in the book is shot in this one style; make it serve the story's mood.",
  "",
  "Composition rules: exactly one cover, first. Sequence like a small book - the cover makes a promise, the middle develops it (prose pages carry the story - a run of short consecutive prose cards works well for a sequence of moments), and the last card lands it (a quote, a map, or a closing prose beat). Vary card types and layouts. Pick one palette family for the whole book and let hues drift within it, so the book reads as one color story. Fields that do not apply to a card type must be null. Do not add a closing card - the player appends one. name = a short title for the whole book.",
  "",
  "Voice - write like an author, not a brochure. Banned words and moves: nestled, vibrant, tapestry, testament, bustling, delve, journey (as metaphor), \"little did they know\", opening every card with \"The\". The book's first line must hook; the last card lands on a beat, not a summary. Read lines aloud in your head - if it sounds like ad copy, rewrite it. Use typographic punctuation: real em dashes (—) and curly apostrophes.",
  "Write with specificity and heart, in the register the story calls for - a love story is not a product launch."
]
).join('\n');

  /* Built-in sample — exercises every layout without an API call */
  var SAMPLE = {
    name: 'The Lighthouse Summer',
    cards: [
      { type: 'cover', title: 'The Lighthouse Summer', kicker: 'Three months on Wren Island',
        image: { h1: 210, h2: 250, label: 'lighthouse at dusk' } },
      { type: 'prose', kicker: 'June', title: 'The Arrival',
        body: 'The ferry only runs twice a week, so when I stepped onto the dock with two suitcases and a typewriter, I knew there was no changing my mind. The keeper’s cottage smelled of salt and cedar.',
        layout: { band: 'bottom', align: 'left', scale: 'standard' },
        image: { h1: 195, h2: 220, label: 'ferry crossing gray water at dawn' } },
      { type: 'gallery', items: [
        { kicker: 'Week One', title: 'The Light', body: 'Forty-two steps up. I counted them every night at eight, and every night the sea looked different.',
          image: { h1: 45, h2: 25, label: 'lamp room at golden hour' } },
        { kicker: 'Week Four', title: 'The Storm', body: 'Three days of wind that bent the grass flat. I read every book in the cottage twice.',
          image: { h1: 230, h2: 260, label: 'storm over the north cliffs' } },
        { kicker: 'Week Nine', title: 'The Whales', body: 'A pod of grays passed so close I could hear them breathe. I forgot to take a single photo.',
          image: { h1: 180, h2: 210, label: 'whale spouts offshore' } }
      ]},
      { type: 'quote',
        lines: ['The sea does not reward', 'those who are too anxious,', 'too greedy, or too impatient.', 'Patience, patience, patience,', 'is what the sea teaches.'],
        attribution: 'Anne Morrow Lindbergh',
        layout: { band: 'middle', align: 'center', scale: 'quiet' },
        image: null },
      { type: 'map', title: 'WREN ISLAND', address: 'Wren Island Lighthouse, San Juan Islands, WA' }
    ]
  };

  global.BookCompiler = {
    compileBook: compileBook,
    STORY_SCHEMA: STORY_SCHEMA,
    SYSTEM_PROMPT: SYSTEM_PROMPT,
    SAMPLE: SAMPLE
  };
})(window);

</script>
<script>
(function () {
  'use strict';

  var stateBox = document.getElementById('stateBox');
  var stateMsg = document.getElementById('stateMsg');
  var stateSpinner = document.getElementById('stateSpinner');

  /* ---------- player chrome: same pull-up sheet as the composer ----------
   * gestures, scrim, and the first-run peek live in BookChrome.sheet */
  var chromeBar = document.getElementById('chromeBar');
  var screenNode = document.getElementById('screen');
  var shareToast = document.getElementById('shareToast');
  var lastPageSeen = -1;
  var isPhone = BookChrome.isPhone;
  var bookSheet = BookChrome.sheet(chromeBar, screenNode);
  var setSheet = bookSheet.set;
  var hintSheet = bookSheet.hint;
  var toast = BookChrome.toaster(shareToast);

  var player = BookRuntime.createPlayer({
    screen: document.getElementById('screen'),
    container: document.getElementById('cardContainer'),
    prevBtn: document.getElementById('prevBtn'),
    nextBtn: document.getElementById('nextBtn'),
    pageBar: document.getElementById('pageBar'),
    tapLeft: document.getElementById('tapLeft'),
    tapRight: document.getElementById('tapRight'),
    keyGate: function () { return stateBox.hidden && !chromeBar.classList.contains('open'); },
    dragGate: function () { return stateBox.hidden; },
    /* swipe up anywhere on the book to pull the action sheet up */
    onSwipeUp: function () { if (isPhone()) setSheet(true); },
    /* the sheet presents itself on the last page — the share moment */
    onPage: function (i, n) {
      if (i === n - 1 && i !== lastPageSeen && isPhone()) setSheet(true);
      lastPageSeen = i;
    },
    onLoaded: function (w) { document.title = w.name + ' — BOOK'; }
  });

  function fail(msg) {
    stateSpinner.hidden = true;
    stateMsg.innerHTML = msg + '<br><br><a href="/">Make a book of your own →</a>';
  }

  /* id from the /b/{id} rewrite path, with ?id= as a fallback */
  var m = location.pathname.match(/\/b\/([1-9A-HJ-NP-Za-km-z]{8,24})/);
  var id = (m && m[1]) || new URLSearchParams(location.search).get('id');

  /* ---------- sheet actions ---------- */
  var realId = m && m[1] ? m[1] : (id && id !== 'sample' ? id : null);
  var libBtn = document.getElementById('libBtn');
  libBtn.hidden = !realId; /* the sample can't be re-published */

  /* remix: carry this book's story into the editor */
  var loadedStory = null;
  document.getElementById('remixBtn').addEventListener('click', function () {
    if (!loadedStory) return;
    try { sessionStorage.setItem('book.edit', JSON.stringify(loadedStory)); } catch (e) {}
    /* absolute under the /b/{id} rewrite; relative on static mirrors */
    location.href = /\/b\//.test(location.pathname) ? '/editor.html' : 'editor.html';
  });

  document.getElementById('shareBtn').addEventListener('click', async function () {
    var link = realId ? location.origin + '/b/' + realId : location.href;
    var safe = BookRuntime.escapeHtml(link);
    var copied = false;
    try { await navigator.clipboard.writeText(link); copied = true; } catch (e) {}
    toast((copied ? 'Link copied — ' : 'This book lives at ') +
      '<a href="' + safe + '" target="_blank" rel="noopener noreferrer">' + safe + '</a>', true);
  });

  /* ＋ Library: the book is already stored — publishing shelves it */
  libBtn.addEventListener('click', async function () {
    if (!realId) return;
    libBtn.disabled = true;
    try {
      var res = await fetch('/api/books/' + encodeURIComponent(realId) + '/publish', { method: 'POST' });
      var data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      toast('On the shelf — <a href="/library">see the library →</a>', true);
    } catch (e) {
      toast('Couldn’t add it to the library' + (e && e.message ? ': ' + BookRuntime.escapeHtml(e.message) : ''));
    } finally {
      libBtn.disabled = false;
    }
  });

  /* the built-in sample — the library's seed book, played without the API */
  if (id === 'sample' || /\/b\/sample$/.test(location.pathname)) {
    stateBox.hidden = true;
    loadedStory = BookCompiler.SAMPLE;
    player.loadBook(BookCompiler.compileBook(BookCompiler.SAMPLE, { height: BookRuntime.canvasHeight() }));
    hintSheet();
    return;
  }

  if (!id) {
    fail('This link is missing its book id.');
    return;
  }

  /* ---------- late-arriving pictures ----------
   * A link opened while the sharer's image fan-out is still running — or
   * after they navigated away mid-run — has empty slots. Two recoveries:
   * this page requests the missing pictures itself (the POST is
   * idempotent per slot, so racing the sharer is harmless), and it also
   * re-reads the book on an interval to pick up images another tab is
   * generating, fading each in as it lands (render() tags slot elements
   * with data-slot). */
  var POLL_MS = window.BOOK_IMG_POLL_MS || 8000; /* tests override the interval */
  var MAX_POLLS = 24;

  function imageUrls(story) {
    var map = {};
    ((story && story.cards) || []).forEach(function (c, i) {
      if (c && c.image) map[String(i)] = c.image.url || '';
      ((c && c.items) || []).slice(0, 5).forEach(function (it, j) {
        if (it && it.image) map[i + '.' + j] = it.image.url || '';
      });
    });
    return map;
  }

  function attachSlot(key, url) {
    Array.prototype.forEach.call(
      document.querySelectorAll('[data-slot="' + key + '"]'),
      function (el) { BookRuntime.attachImage(el, url); }
    );
  }

  /* The long-call host (see composer): image generation without SWA's
   * ~45s response cap; same-origin remains the fallback. */
  var apiFetch = BookChrome.apiFetch;

  /* Actively finish the book: request each missing picture, one at a
   * time (mirrors the composer's fan-out — sequential keeps each call
   * inside its host's response budget). 503/429 means no provider or no
   * budget — stop and leave the rest to the polling net. */
  async function fanOutImages(missing) {
    var netFails = 0;
    for (var i = 0; i < missing.length; i++) {
      var res;
      try {
        res = await apiFetch('/api/books/' + encodeURIComponent(id) + '/images', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot: missing[i] }),
          keepalive: true
        });
      } catch (e) {
        /* a severed connection may still land server-side (raised
         * IMAGE_TIMEOUT_MS) — the polling net collects it; two drops
         * in a row means we're offline */
        if (++netFails >= 2) return;
        continue;
      }
      netFails = 0;
      if (res.status === 503 || res.status === 429) return;
      if (!res.ok) continue;
      var d = null;
      try { d = await res.json(); } catch (e) { continue; }
      if (d && d.url) attachSlot(d.slot, d.url);
    }
  }

  function watchImages(story) {
    var missing = [];
    var urls = imageUrls(story);
    for (var k in urls) { if (!urls[k]) missing.push(k); }
    if (!missing.length) return;
    fanOutImages(missing);
    var polls = 0;
    var timer = setInterval(function () {
      if (++polls > MAX_POLLS) return clearInterval(timer);
      fetch('/api/books/' + encodeURIComponent(id))
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (doc) {
          if (!doc) return;
          var now = imageUrls(doc.story || {});
          missing = missing.filter(function (k) {
            if (!now[k]) return true;
            Array.prototype.forEach.call(
              document.querySelectorAll('[data-slot="' + k + '"]'),
              function (el) { BookRuntime.attachImage(el, now[k]); }
            );
            return false;
          });
          if (!missing.length) clearInterval(timer);
        })
        .catch(function () {});
    }, POLL_MS);
  }

  fetch('/api/books/' + encodeURIComponent(id))
    .then(function (res) {
      if (res.status === 404) throw new Error('NOT_FOUND');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    })
    .then(function (doc) {
      var book = BookCompiler.compileBook(doc.story || {}, { height: BookRuntime.canvasHeight(), date: doc.createdAt });
      if (book.cards.length < 2) throw new Error('EMPTY');
      stateBox.hidden = true;
      loadedStory = doc.story;
      player.loadBook(book);
      hintSheet();
      watchImages(doc.story);
    })
    .catch(function (e) {
      if (e && e.message === 'NOT_FOUND') fail('This book doesn’t exist — the link may be mistyped or the book was removed.');
      else if (e && e.message === 'EMPTY') fail('This book has no cards to show.');
      else fail('Couldn’t load this book right now. Check your connection and refresh.');
    });
})();
</script>
