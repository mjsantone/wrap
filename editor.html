<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#100F12">

<title>Write a book — BOOK</title>

<link rel="stylesheet" href="fonts.css">
<style>
:root { --accent: #FF5A36; --ink: #100F12; --paper: #F4F1EA; --muted: #9a9da5; }
/* WrapRuntime styles — the player stage, card flip mechanics, and every
 * rendered component. Shared by all pages; page chrome lives in each page. */

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #000; }
html, body { overscroll-behavior: none; }

.player-stage {
  position: fixed; inset: 0; margin: 0; background: #000;
  display: grid; place-items: center;
  font-family: 'Open Sans', 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
}
.player-stage[hidden] { display: none; }
.screen {
  position: relative;
  width: min(100vw, calc(100vh * 640 / 910));
  aspect-ratio: 640 / 910;
  background: #000; overflow: hidden;
  /* all gestures are ours: horizontal flips and the vertical
   * action-sheet swipe — browser panning would pointercancel them */
  touch-action: none;
  /* swiping must never select card text */
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
/* Modern phones are much taller than the 640×910 design canvas — fill the
 * whole screen and let the card background absorb the extra height; the
 * runtime centers the canvas vertically (rescale in runtime.js). */
@media (max-aspect-ratio: 640/910) {
  .screen { width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; }
}

/* ---- WRAP card mechanics (values from wrap.co/wraps/main.css) ---- */
.card-container {
  position: absolute; inset: 0; background: #000;
  perspective: 2000px; perspective-origin: left center;
}
.card {
  position: absolute; inset: 0; overflow: hidden;
  transform-origin: 0 0; transform: rotateY(0deg);
  transition: transform 0.7s cubic-bezier(0.26, 0.65, 0.37, 1.07);
  will-change: transform; background: #fff;
}
.card.turned { transform: rotateY(-90deg); }
.card .fold {
  position: absolute; inset: 0; z-index: 990; pointer-events: none;
  background: linear-gradient(100deg, rgba(0,0,0,0.55), rgba(0,0,0,0.05) 60%);
  opacity: 0; transition: opacity 0.7s cubic-bezier(0.26, 0.65, 0.37, 1.07);
}
.card.turned .fold { opacity: 1; }
@keyframes bounceCardHintAnimation {
  0%, 40%, 57%, 100% { animation-timing-function: cubic-bezier(0.215,0.61,0.355,1); transform: rotateY(0rad); }
  30% { animation-timing-function: cubic-bezier(0.755,0.05,0.855,0.06); transform: rotateY(-0.6rad); }
  50% { animation-timing-function: cubic-bezier(0.755,0.05,0.855,0.06); transform: rotateY(-0.2rad); }
}
.card.animate-swipe-hint { animation: 1.9s 2s 1 bounceCardHintAnimation; }

.canvas { position: absolute; top: 0; left: 0; width: 640px; height: var(--canvas-h, 910px); transform-origin: 0 0;
  /* Fraunces carries an opsz axis (verified in the embedded subset) —
   * keep optical sizing explicit so display cuts sharpen at title sizes */
  font-optical-sizing: auto; }
.canvas p { margin: 0 0 0.4em; }
.canvas p:last-child { margin-bottom: 0; }

/* ---- rendered components ---- */
.cmp { position: absolute; margin: 0; }
.cmp-image { overflow: hidden; }
.img-ph { position: absolute; inset: 0; display: grid; place-items: center; }
/* generated photograph over its duotone placeholder, fading in on load */
.img-real {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; opacity: 0; transition: opacity 0.6s ease;
}
.img-real.loaded { opacity: 1; }
/* palette tone-map: rides above the photo, invisible until it loads */
.img-tone {
  position: absolute; inset: 0; z-index: 2; pointer-events: none;
  mix-blend-mode: color; opacity: 0; transition: opacity 0.8s ease;
}
.img-real { z-index: 1; }
.cmp-image:has(.img-real.loaded) .img-tone { opacity: 0.24; }
/* ---- motion system: each rule gated by a flag class on .screen ---- */
/* Ken Burns: the current card's photo drifts, slow and alive */
@keyframes kenBurns {
  from { transform: scale(1); }
  to { transform: scale(1.045); }
}
.m-kb .card.current .img-real.loaded { animation: kenBurns 26s ease-in-out infinite alternate; }
/* photo settle: a loaded picture eases down from a slight zoom */
.m-settle .img-real { transform: scale(1.05); transition: opacity 0.6s ease, transform 1.4s ease; }
.m-settle .img-real.loaded { transform: scale(1); }
/* drag parallax: type lags the photo while the page turns */
.m-par .card.is-dragging .canvas > .cmp:not(.cmp-image):not(.cmp-gradation):not(.cmp-veil):not(.cmp-outline) {
  transform: translateX(var(--par, 0px));
}
/* a whisper of shadow keeps type legible when a pale photograph fights
 * the scrim — only pages that carry an image get it (sibling selector) */
.canvas > .cmp-image ~ .cmp { text-shadow: 0 1px 24px rgba(0, 0, 0, 0.35); }
/* quote attributions step down and apart from the quotation itself */
.q-attr {
  display: block; font-size: 0.62em; margin-top: 0.8em;
  letter-spacing: 0.04em; opacity: 0.85;
}
/* editorial drop cap on left-set prose */
.dropcap {
  float: left; font-family: 'Fraunces', Georgia, serif; font-weight: 550;
  font-size: 3.05em; line-height: 0.82; padding: 0.04em 0.09em 0 0;
}
/* subtle loading state: the scene label breathes quietly on the solid tone */
.img-ph span {
  font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.3em;
  text-indent: 0.3em; /* recenters tracked caps */
  text-transform: uppercase; color: rgba(255,255,255,0.32); text-align: center;
  max-width: 76%; animation: phBreathe 3.4s ease-in-out infinite;
}
@keyframes phBreathe {
  0%, 100% { opacity: 0.55; }
  50% { opacity: 1; }
}
/* solid scrims — the page design is gradient-free; a uniform veil keeps
 * type legible on any band, not just the bottom */
.cmp-gradation { pointer-events: none; background: rgba(12, 13, 15, 0.4); }
.cmp-veil { pointer-events: none; background: rgba(12, 13, 15, 0.48); }
.cmp-outline { pointer-events: none; }
.cmp-outline::after { content: ""; position: absolute; inset: 40px; border: 3px solid rgba(253,254,255,0.92); }
.cmp-action { display: block; z-index: 900; }
.cmp-button { display: grid; place-items: center; white-space: nowrap; }
.cmp-location {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  color: #fff; text-decoration: none; font-size: 24px;
  border: 2px solid rgba(255,255,255,0.85); border-radius: 6px;
  background: rgba(0,0,0,0.25) !important;
}
.cmp-map { display: block; overflow: hidden; text-decoration: none; -webkit-user-drag: none; }
.cmp-map > svg.map-bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.cmp-map .map-pin {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
}
.cmp-map .map-pin span {
  font-family: 'Montserrat', sans-serif; font-size: 22px; color: #fff;
  background: rgba(0,0,0,0.55); border-radius: 8px; padding: 12px 24px;
  max-width: 80%; text-align: center; line-height: 1.4;
}
.cmp-flow {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  color: #fff; font-size: 28px; font-family: 'Open Sans', sans-serif;
  border: 2px solid rgba(255,255,255,0.85); border-radius: 10px;
  background: rgba(0,0,0,0.3);
}
.cmp-youtube { display: block; }
.cmp-youtube svg { width: 100%; height: 100%; display: block; transition: transform 0.15s ease; }
.cmp-youtube:hover svg { transform: scale(1.08); }
.cmp-widget {
  display: flex; align-items: center; justify-content: center;
  color: #fff; text-decoration: none; font-size: 26px; font-family: 'Open Sans', sans-serif;
  border: 2px solid rgba(255,255,255,0.9); border-radius: 8px;
  background: rgba(0,0,0,0.3) !important;
  transition: background 0.2s;
}
.cmp-widget:hover { background: rgba(255,90,54,0.35) !important; }
.cmp-end { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
/* the colophon speaks in the book's own voice: Fraunces italic, not UI sans */
.cmp-end p { color: #fff; font-weight: 500; font-style: italic; font-size: 30px; margin: 5px 0; font-family: 'Fraunces', Georgia, serif; max-width: 85%; text-wrap: balance; }
.cmp-end .end-colophon {
  font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.3em;
  text-indent: 0.3em; /* recenters tracked caps */
  text-transform: uppercase; color: rgba(244,241,234,0.45); line-height: 2.1;
  margin-bottom: 26px;
}
.cmp-end .end-wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 34px; letter-spacing: 0.04em; color: #fff; margin-top: 6px; }
.cmp-end .end-wordmark b { color: var(--accent); }
.cmp-end .replay {
  margin-top: 28px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 16px;
  letter-spacing: 0.12em; text-indent: 0.12em; text-transform: uppercase;
  color: #fff; background: #434343; border: none; border-radius: 3px; padding: 14px 40px;
  box-shadow: 0 2px 0 rgba(35,31,32,0.25); transition: all 0.2s ease-in-out;
}
.cmp-end .replay:hover { background: var(--accent); color: #212121; }

/* ---- galleries ---- */
.cmp-gallery { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden;
  scroll-snap-type: y mandatory; scrollbar-width: none; }
.cmp-gallery::-webkit-scrollbar { display: none; }
.cmp-gallery-item { position: relative; width: 640px; height: var(--canvas-h, 910px); scroll-snap-align: start; overflow: hidden; }
.gallery-hint {
  position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
  z-index: 970; color: #fff; opacity: 0.75; pointer-events: none;
  animation: hintBob 1.6s ease-in-out infinite;
  filter: drop-shadow(0 1px 3px rgba(0,0,0,0.8)); transition: opacity 0.4s;
}
.gallery-hint.hidden { opacity: 0; }
@keyframes hintBob { 0%,100% { transform: translate(-50%, 0); } 50% { transform: translate(-50%, 8px); } }

/* ---- player chrome ---- */
.pagination-track { position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
  background: #000; z-index: 1000; pointer-events: none; overflow: hidden; }
.pagination-track .current-page { position: absolute; height: 100%; background: var(--accent); transition: left 0.12s ease-out; }
.pv-btn {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 995;
  width: 46px; height: 70px; border: none; background: transparent; cursor: pointer;
  color: #fff; opacity: 0.15; transition: opacity 0.25s ease-out;
  display: grid; place-items: center; padding: 0;
}
.pv-btn:hover, .pv-btn:focus-visible { opacity: 0.9; }
.pv-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
.pv-btn[hidden] { display: none; }
.pv-btn.prev { left: 2px; } .pv-btn.next { right: 2px; }
.pv-btn svg { filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)); }
/* phones flip by dragging or tapping the edges — hide the desktop chevrons */
@media (max-width: 640px), (hover: none) and (pointer: coarse) {
  .pv-btn { display: none; }
}
.tap-zone { position: absolute; top: 60px; bottom: 40px; width: 15%; z-index: 960; cursor: pointer; }
.tap-zone.left { left: 0; } .tap-zone.right { right: 0; }

@media (prefers-reduced-motion: reduce) {
  .card, .card .fold { transition: none; }
  .card.animate-swipe-hint, .gallery-hint { animation: none; }
  /* the ambient motion system rests too: no drift, no settle, no breathing */
  .m-kb .card.current .img-real.loaded { animation: none; }
  .m-settle .img-real { transform: none; transition: opacity 0.6s ease; }
  .img-ph span { animation: none; opacity: 0.8; }
  .m-par .card.is-dragging .canvas > .cmp:not(.cmp-image):not(.cmp-gradation):not(.cmp-veil):not(.cmp-outline) { transform: none; }
}

/* Player chrome shared by the composer and the viewer: corner pills on
 * desktop, a swipe-up pull-up action sheet on phones. Each page provides
 * a .chrome bar (with .back-btn actions, the muted one marked .quiet),
 * plus a .share-toast; the sheet gestures live in each page's script. */
.back-btn {
  position: absolute; top: 10px; left: 10px; z-index: 1010;
  background: rgba(0,0,0,0.45); color: #fff; border: none; border-radius: 999px;
  font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.06em;
  padding: 8px 14px; cursor: pointer; opacity: 0.55; transition: opacity 0.2s;
  text-decoration: none; text-align: center;
}
.back-btn:hover, .back-btn:focus-visible { opacity: 1; }
/* desktop: the chrome container is transparent — pills sit in the corners */
.chrome { display: contents; }
.pv-actions { position: absolute; top: 10px; right: 10px; z-index: 1010; display: flex; gap: 6px; }
.pv-actions .back-btn { position: static; }

/* phones: actions live in a pull-up sheet — swipe up on the book to open */
@media (max-width: 640px), (hover: none) and (pointer: coarse) {
  /* open sheet: the book recedes — scaled, dimmed, rounded like a card */
  .card-container { transition: transform 0.28s ease, filter 0.28s ease, border-radius 0.28s ease; }
  .screen.sheet-open .card-container {
    transform: scale(0.93);
    transform-origin: 50% 40%;
    filter: brightness(0.5) saturate(0.9);
    border-radius: 20px; overflow: hidden;
  }
  .chrome {
    touch-action: none; /* we handle vertical drags — stop browser panning */
    display: flex; flex-direction: column; gap: 10px;
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 1022;
    background: #101114;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.5);
    padding: 26px 18px calc(20px + env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform 0.25s ease;
  }
  .chrome::before { /* grab bar */
    content: ''; position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 4px; border-radius: 999px; background: rgba(244,241,234,0.3);
  }
  .chrome.open { transform: translateY(0); }
  /* first-run affordance: the grab bar peeks over the bottom edge until
   * the sheet has been discovered once (see hintSheet in the pages) */
  .chrome.peek { transform: translateY(calc(100% - 26px)); }
  .chrome .back-btn, .pv-actions .back-btn {
    position: static; width: 100%; opacity: 1;
    background: rgba(255,255,255,0.08); font-size: 14px; padding: 15px;
    border-radius: 10px;
  }
  .pv-actions { position: static; display: contents; }
  .chrome .quiet { order: 4; background: none; color: var(--muted, #9a9da5); }
  /* the toast clears the home-indicator area (specificity beats the later base rule) */
  .screen .share-toast { bottom: calc(26px + env(safe-area-inset-bottom)); }
}
.share-toast {
  position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
  z-index: 1030; max-width: 88%; /* transient — wins over all player chrome */
  background: rgba(0,0,0,0.8); color: #fff; border-radius: 10px;
  font-family: 'Open Sans', sans-serif; font-size: 13px; line-height: 1.5;
  padding: 10px 16px; text-align: center; overflow-wrap: anywhere;
}
.share-toast[hidden] { display: none; }
.share-toast a { color: var(--accent, #ff5a36); text-decoration: none; }
.share-toast button {
  margin-left: 10px; cursor: pointer;
  font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  background: var(--accent, #ff5a36); color: var(--ink, #100F12); border: none; border-radius: 2px;
  padding: 7px 12px;
}
.share-toast button:disabled { opacity: 0.5; cursor: default; }


  :root {
    --ink: #100F12;
    --panel: #17161A;
    --panel-2: #1D1C21;
    --line: rgba(244, 241, 234, 0.12);
    --paper: #F4F1EA;
    --muted: #9a9da5;
    --accent: #FF5A36;
  }
  html, body { background: var(--ink); margin: 0; height: auto; overflow: auto; }
  body { color: var(--paper); font-family: 'Open Sans', sans-serif; }
  .editor { min-height: 100vh; display: flex; flex-direction: column; }

  /* ---- top bar ---- */
  .ed-top {
    display: flex; align-items: center; gap: 14px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 10px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; background: var(--ink); z-index: 40;
  }
  .ed-wordmark { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 18px; text-decoration: none; color: var(--paper); }
  .ed-wordmark b { color: var(--accent); }
  .ed-name {
    flex: 1; min-width: 60px;
    background: none; border: none; outline: none; color: var(--paper);
    font-family: 'Fraunces', Georgia, serif; font-weight: 550; font-size: 19px;
    border-bottom: 1px dashed transparent; padding: 2px 0;
  }
  .ed-name:hover, .ed-name:focus { border-bottom-color: var(--line); }
  .ed-saved { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
  .ed-btn {
    font-family: 'Montserrat', sans-serif; font-size: 12px; letter-spacing: 0.08em;
    border-radius: 8px; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line);
    background: none; color: var(--paper); text-decoration: none; white-space: nowrap;
  }
  .ed-btn:hover { border-color: rgba(244,241,234,0.35); }
  .ed-btn.primary { background: var(--accent); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .ed-btn.primary:disabled { opacity: 0.5; cursor: default; }

  /* ---- card rail ---- */
  .ed-rail {
    display: flex; gap: 10px; align-items: stretch;
    padding: 14px 16px; overflow-x: auto; border-bottom: 1px solid var(--line);
    scrollbar-width: thin;
  }
  .ed-thumb {
    position: relative; flex: 0 0 auto; width: 58px; height: 82px;
    border-radius: 6px; overflow: hidden; cursor: pointer;
    outline: 2px solid transparent; outline-offset: 2px;
    background: #000; border: none; padding: 0;
  }
  .ed-thumb.sel { outline-color: var(--accent); }
  .ed-thumb .canvas { position: absolute; top: 0; left: 0; width: 640px; height: 910px; transform: scale(0.090625); transform-origin: 0 0; pointer-events: none; }
  .ed-thumb .t-label {
    position: absolute; inset: auto 0 0 0; text-align: center;
    font-family: 'Montserrat', sans-serif; font-size: 9.5px; letter-spacing: 0.06em; text-indent: 0.06em; text-transform: uppercase;
    color: rgba(255,255,255,0.9); background: rgba(0,0,0,0.5); padding: 2px 0;
  }
  .ed-add {
    flex: 0 0 auto; width: 58px; height: 82px; border-radius: 6px;
    border: 1px dashed var(--line); background: none; color: var(--muted);
    font-size: 22px; cursor: pointer;
  }
  .ed-add:hover { color: var(--paper); border-color: rgba(244,241,234,0.4); }
  .ed-typemenu {
    position: absolute; z-index: 60; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 10px; padding: 6px; display: flex; flex-direction: column; min-width: 150px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .ed-typemenu button {
    background: none; border: none; color: var(--paper); text-align: left; cursor: pointer;
    font-family: 'Open Sans', sans-serif; font-size: 14px; padding: 9px 12px; border-radius: 6px;
  }
  .ed-typemenu button:hover { background: rgba(255,255,255,0.07); }
  .ed-typemenu[hidden] { display: none; }

  /* ---- main split ----
   * One centered content column: the top bar and rail share its edges
   * (via matching padding), the fields sit left, and the preview card
   * grows with the window instead of stranding the right half. */
  .ed-top, .ed-rail { padding-left: max(16px, calc((100vw - 1240px) / 2)); padding-right: max(16px, calc((100vw - 1240px) / 2)); }
  .ed-main { flex: 1; display: flex; align-items: flex-start; gap: 28px; width: 100%; max-width: 1240px; margin: 0 auto; }
  .ed-panel { flex: 1 1 520px; max-width: 620px; padding: 24px 16px 90px; }
  .ed-stage {
    flex: 1 1 440px; position: sticky; top: 118px;
    display: flex; justify-content: center; padding: 28px 16px;
  }
  .ed-card {
    position: relative;
    /* as large as the column and the viewport height allow */
    width: min(clamp(300px, 32vw, 470px), calc((100vh - 190px) * 640 / 910));
    aspect-ratio: 640 / 910;
    border-radius: 14px; overflow: hidden; background: #000;
    box-shadow: 0 18px 60px rgba(0,0,0,0.55);
  }
  /* the stage is direct-manipulation: text edits in place, everything
   * else clicks through to its field in the panel */
  .ed-card .canvas { position: absolute; top: 0; left: 0; width: 640px; height: 910px; transform-origin: 0 0; }
  .ed-card [data-f] { cursor: text; }
  .ed-card [data-f]:hover { outline: 2px dashed rgba(255,90,54,0.55); outline-offset: 3px; }
  .ed-card [data-f][contenteditable] { outline: 2px solid rgba(255,90,54,0.85); outline-offset: 3px; cursor: text; }
  .ed-card .cmp-image, .ed-card .cmp-action, .ed-card .cmp-youtube, .ed-card .cmp-map { cursor: pointer; }
  /* a tapped-through field flashes so the eye lands on it */
  @keyframes edFlash { 0% { border-color: var(--accent); } 100% { border-color: var(--line); } }
  .ed-field .flash { animation: edFlash 1.2s ease-out; }

  /* ---- panel widgets ---- */
  .ed-cardbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .ed-cardtitle { font-family: 'Fraunces', Georgia, serif; font-weight: 550; font-size: 21px; flex: 1; }
  .ed-icon {
    background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 7px;
    width: 32px; height: 32px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .ed-icon:hover:not(:disabled) { color: var(--paper); border-color: rgba(244,241,234,0.4); }
  .ed-icon:disabled { opacity: 0.3; cursor: default; }
  .ed-icon.danger:hover { color: #ff7a64; border-color: #ff7a64; }
  .ed-field { margin-bottom: 16px; }
  .ed-label {
    display: block; font-family: 'Montserrat', sans-serif; font-size: 10px;
    letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px;
  }
  .ed-field input[type="text"], .ed-field textarea {
    width: 100%; box-sizing: border-box; background: var(--panel); color: var(--paper);
    border: 1px solid var(--line); border-radius: 9px; padding: 11px 13px;
    font-family: 'Open Sans', sans-serif; font-size: 15px; line-height: 1.5; outline: none;
  }
  .ed-field input:focus, .ed-field textarea:focus { border-color: rgba(255,90,54,0.6); }
  .ed-field textarea { min-height: 96px; resize: vertical; }
  .ed-hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.5; }

  .ed-seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .ed-seg button {
    background: var(--panel); border: 1px solid var(--line); color: var(--muted);
    font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.06em;
    border-radius: 999px; padding: 7px 14px; cursor: pointer;
  }
  .ed-seg button.on { background: rgba(255,90,54,0.16); border-color: var(--accent); color: var(--paper); }

  .ed-section {
    border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 16px;
    background: rgba(255,255,255,0.02);
  }
  .ed-section > .ed-label { margin-bottom: 12px; }
  .ed-swatch { width: 34px; height: 34px; border-radius: 8px; flex: 0 0 auto; border: 1px solid var(--line); }
  .ed-huerow { display: flex; align-items: center; gap: 12px; }
  .ed-huerow input[type="range"] { flex: 1; accent-color: var(--accent); }
  .ed-photothumb { width: 46px; height: 65px; object-fit: cover; border-radius: 6px; }

  .ed-note { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ---- full-book preview overlay ---- */
  .ed-preview { position: fixed; inset: 0; z-index: 100; background: rgba(8,8,10,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ed-preview[hidden] { display: none; }
  .ed-preview .player-stage { width: min(400px, 96vw); height: min(86vh, calc(96vw * 910 / 640)); position: relative; }
  .ed-preview .screen { width: 100%; height: 100%; border-radius: 18px; overflow: hidden; }
  .ed-closepv {
    margin-top: 14px; background: rgba(0,0,0,0.55); color: #fff; border: 1px solid var(--line);
    border-radius: 999px; font-family: 'Montserrat', sans-serif; font-size: 12px;
    letter-spacing: 0.08em; padding: 10px 20px; cursor: pointer;
  }

  .editor .share-toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 120; }

  /* ---- the floating page peek ----
   * Under 900px the side-by-side stage goes away; this small live card
   * takes its place — always current, tap to play the whole book. */
  .ed-peek {
    display: none; position: fixed; z-index: 80;
    right: 14px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 104px; aspect-ratio: 640 / 910;
    border: 1px solid rgba(244,241,234,0.18); border-radius: 10px; overflow: hidden;
    background: #000; box-shadow: 0 12px 36px rgba(0,0,0,0.65);
    padding: 0; cursor: pointer;
  }
  .ed-peek .canvas { pointer-events: none; }

  /* ---- narrow screens: stacked, live peek + preview overlay ---- */
  @media (max-width: 900px) {
    .ed-stage { display: none; }
    .ed-peek { display: block; }
    .ed-panel { max-width: none; padding-bottom: 170px; /* clear the peek */ }
    .ed-top { flex-wrap: wrap; }
  }
  @media (max-width: 640px), (hover: none) and (pointer: coarse) {
    /* 16px inputs stop iOS Safari from zooming the page on focus */
    .ed-field input[type="text"], .ed-field textarea, .ed-name { font-size: 16px; }
    /* thumb-sized page operations */
    .ed-icon { width: 40px; height: 40px; font-size: 16px; }
    .ed-seg button { padding: 9px 15px; }
    /* the peek is the preview on phones — the button is redundant */
    #previewBtn { display: none; }
  }
</style>

<script>
/* BookRuntime — shared renderer + flip engine for all BOOK pages.
 * Single source of truth: consumed by index.html (composer) and player.html (library).
 * Node vocabulary is the union of the two producers:
 *   - reverse-engineered wrap.co JSON (player): textbox, image(url), box, gallery,
 *     button(css content label), action, location, youtube, widget, flow, background, end
 *   - the story compiler (composer): image(hue/lbl), gradation, veil, outline,
 *     textbox, button(label), action, youtube, map, gallery, end
 */
(function (global) {
  'use strict';

  var GRADATION_ASSET = '26e27ad1';   /* wrap.co's shared dark-gradient overlay PNG */
  var OUTLINE_ASSET   = '66f61527';   /* wrap.co's shared white outline-frame PNG  */

  /* ---------- helpers ---------- */

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  /* Only allow safe link schemes — model- or JSON-supplied URLs must never
   * become javascript:/data: sinks (they'd run with access to localStorage). */
  function safeUrl(url) {
    if (typeof url !== 'string') return null;
    var u = url.trim();
    if (/^(https?:|mailto:|tel:)/i.test(u)) return u;
    return null;
  }

  function applyCss(el, css) {
    if (!css) return;
    for (var k in css) {
      if (k === 'content') continue; /* button labels ride in css.content; render() reads it as text */
      el.style.setProperty(k, css[k]);
    }
    if (!css.position || css.position !== 'absolute') el.style.position = 'absolute';
  }

  /* Solid ink tone for an image slot awaiting its photograph — the page
   * design is gradient-free; h2 rides along only for stored-story compat. */
  function grad(h1, h2) {
    return 'hsl(' + h1 + ', 22%, 17%)';
  }

  /* Logical canvas height for the adaptive canvas: follows the viewport
   * aspect, clamped between the classic 910 and a modern tall phone. */
  function canvasHeight() {
    var w = global.innerWidth || 640, h = global.innerHeight || 910;
    return Math.max(910, Math.min(1390, Math.round(640 * h / w)));
  }

  /* Real photographs live behind our own /api/images/ ids (or https, for
   * future CDN serving) — anything else stays a duotone placeholder. */
  function imageSrc(url) {
    if (typeof url !== 'string') return null;
    var u = url.trim();
    if (/^https:\/\//i.test(u) || /^\/api\/images\//.test(u)) return u;
    return null;
  }

  /* Lay a real image over a slot's duotone placeholder; it fades in on
   * load, so books are viewable the instant the placeholders render.
   * Called at render time (stored urls) and by the composer's fan-out
   * as freshly generated images land. */
  function attachImage(el, url) {
    var src = imageSrc(url);
    if (!src || el.querySelector('.img-real')) return;
    var im = document.createElement('img');
    im.className = 'img-real';
    im.alt = '';
    im.decoding = 'async';
    im.loading = 'lazy';
    im.addEventListener('load', function () { im.classList.add('loaded'); });
    im.src = src;
    el.appendChild(im);
  }

  function hashHue(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h % 360;
  }

  function extLink(el, url) {
    var u = safeUrl(url);
    if (!u) return false;
    el.href = u;
    if (u.indexOf('tel:') !== 0 && u.indexOf('mailto:') !== 0) {
      el.target = '_blank'; el.rel = 'noopener noreferrer';
    }
    return true;
  }

  /* ---------- component renderer ---------- */
  /* ctx: { bookName, player } — player provides showCard(i) for the end-card replay. */

  function render(node, parent, ctx) {
    var t = node.t, el;

    if (t === 'image') {
      var url = node.url || '';
      var isGrad = url.indexOf(GRADATION_ASSET) !== -1 || /gradation|overlay/i.test(node.n || '');
      var isOutline = url.indexOf(OUTLINE_ASSET) !== -1 || /outline/i.test(node.n || '');
      el = document.createElement('div');
      el.className = 'cmp ' + (isGrad ? 'cmp-gradation' : isOutline ? 'cmp-outline' : 'cmp-image');
      applyCss(el, node.css);
      if (!isGrad && !isOutline) {
        var h1 = (node.hue && node.hue[0] != null) ? node.hue[0] : hashHue(url || node.n || 'x');
        var h2 = (node.hue && node.hue[1] != null) ? node.hue[1] : (h1 + 40) % 360;
        var ph = document.createElement('div');
        ph.className = 'img-ph';
        ph.style.background = grad(h1, h2);
        var tag = document.createElement('span');
        tag.textContent = node.lbl || 'image';
        ph.appendChild(tag);
        el.appendChild(ph);
        /* tone-map the photograph toward the book's palette: a hue wash
         * that only shows once a real image has loaded (see .img-tone) */
        var tone = document.createElement('div');
        tone.className = 'img-tone';
        tone.style.background = 'hsl(' + h1 + ', 50%, 40%)';
        el.appendChild(tone);
        /* slot key: how the composer's image fan-out finds this element */
        if (node.slot != null) el.setAttribute('data-slot', node.slot);
        attachImage(el, url);
      }
    }
    else if (t === 'gradation' || t === 'veil') {
      el = document.createElement('div');
      el.className = 'cmp ' + (t === 'veil' ? 'cmp-veil' : 'cmp-gradation');
      applyCss(el, node.css);
    }
    else if (t === 'outline') {
      el = document.createElement('div');
      el.className = 'cmp cmp-outline';
      applyCss(el, node.css);
    }
    else if (t === 'textbox') {
      el = document.createElement('div');
      el.className = 'cmp';
      applyCss(el, node.css);
      el.innerHTML = (node.text || '').replace(/\n/g, ' ');
      /* source-field tag: the editor's direct selection reads this */
      if (node.f) el.setAttribute('data-f', node.f);
    }
    else if (t === 'box' || t === 'background') {
      el = document.createElement('div');
      el.className = 'cmp';
      applyCss(el, node.css);
    }
    else if (t === 'button') {
      el = document.createElement('div');
      el.className = 'cmp cmp-button';
      applyCss(el, node.css);
      var label = node.label;
      if (label == null && node.css && node.css.content) {
        label = String(node.css.content).replace(/^['"]|['"]$/g, '');
      }
      el.textContent = label || '';
      if (node.f) el.setAttribute('data-f', node.f);
    }
    else if (t === 'action') {
      el = document.createElement('a');
      el.className = 'cmp cmp-action';
      applyCss(el, node.css);
      var au = safeUrl(node.url);
      if (au && au !== 'http://' && au !== 'https://') extLink(el, au);
      el.setAttribute('aria-label', node.n || 'link');
    }
    else if (t === 'youtube') {
      el = document.createElement('a');
      el.className = 'cmp cmp-youtube';
      applyCss(el, node.css);
      extLink(el, node.url);
      el.setAttribute('aria-label', 'Play video');
      el.innerHTML = '<svg viewBox="0 0 100 100" aria-hidden="true">' +
        '<circle cx="50" cy="50" r="46" fill="rgba(0,0,0,0.45)" stroke="#fff" stroke-width="5"/>' +
        '<polygon points="40,30 74,50 40,70" fill="#fff"/></svg>';
    }
    else if (t === 'widget') {
      el = document.createElement('a');
      el.className = 'cmp cmp-widget';
      applyCss(el, node.css);
      extLink(el, node.url);
      var wlabel = /typeform/i.test(node.n || '') ? 'Open Form' : (node.n || 'Open');
      el.innerHTML = '<span>' + escapeHtml(wlabel) + '</span>';
      el.title = node.n || '';
    }
    else if (t === 'flow') {
      el = document.createElement('div');
      el.className = 'cmp cmp-flow';
      applyCss(el, node.css);
      el.innerHTML = '<svg width="24" height="29" viewBox="0 0 35 42" fill="none" aria-hidden="true">' +
        '<rect x="2" y="2" width="31" height="38" rx="4" stroke="#fff" stroke-width="3"/>' +
        '<path d="M9 12 H26 M9 20 H26 M9 28 H18" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>' +
        '<span>' + escapeHtml(node.n || 'Form') + '</span>';
      el.title = 'Form (original service offline)';
    }
    else if (t === 'location' || t === 'map') {
      var isMap = t === 'map' || (node.b || []).indexOf('locationMap') !== -1;
      el = document.createElement('a');
      el.href = 'https://maps.google.com/?q=' + encodeURIComponent(node.value || '');
      el.target = '_blank'; el.rel = 'noopener noreferrer';
      el.title = node.value || '';
      el.draggable = false; /* native link-drag would swallow the flip drag */
      applyCss(el, node.css);
      if (isMap) {
        el.className = 'cmp cmp-map';
        el.innerHTML =
          '<svg class="map-bg" viewBox="0 0 640 910" preserveAspectRatio="xMidYMid slice" aria-hidden="true">' +
          '<rect width="640" height="910" fill="#2a2d31"/>' +
          '<g stroke="#3c4046" stroke-width="10"><path d="M-20 200 H660 M-20 430 H660 M-20 660 H660 M120 -20 V930 M330 -20 V930 M520 -20 V930"/></g>' +
          '<g stroke="#43474d" stroke-width="22"><path d="M-20 320 H660 M240 -20 V930"/></g>' +
          '<path d="M-20 780 Q320 700 660 800" stroke="#39546b" stroke-width="26" fill="none"/></svg>' +
          '<div class="map-pin"><svg width="52" height="66" viewBox="0 0 20 26" fill="none">' +
          '<path d="M10 1 C5 1 1.5 4.8 1.5 9.4 C1.5 15.6 10 25 10 25 C10 25 18.5 15.6 18.5 9.4 C18.5 4.8 15 1 10 1 Z" fill="#e8534a"/>' +
          '<circle cx="10" cy="9.4" r="3.4" fill="#fff"/></svg>' +
          '<span>' + escapeHtml(node.value || '') + '</span></div>';
      } else {
        el.className = 'cmp cmp-location';
        el.innerHTML = '<svg width="20" height="26" viewBox="0 0 20 26" fill="none" aria-hidden="true">' +
          '<path d="M10 1 C5 1 1.5 4.8 1.5 9.4 C1.5 15.6 10 25 10 25 C10 25 18.5 15.6 18.5 9.4 C18.5 4.8 15 1 10 1 Z" fill="#fff"/>' +
          '<circle cx="10" cy="9.4" r="3.4" fill="#212121"/></svg>' +
          '<span>Store Locator</span>';
      }
    }
    else if (t === 'end') {
      el = document.createElement('div');
      el.className = 'cmp cmp-end';
      applyCss(el, node.css);
      /* the colophon: how a small press signs off */
      var told = '';
      if (ctx.date) {
        var d = new Date(ctx.date);
        if (!isNaN(d)) {
          told = 'Told ' + ['January','February','March','April','May','June','July',
            'August','September','October','November','December'][d.getMonth()] + ' ' + d.getFullYear();
        }
      }
      el.innerHTML = '<p>' + escapeHtml(ctx.bookName || '') + '</p>' +
        '<div class="end-colophon">' + (told ? escapeHtml(told) + '<br>' : '') +
        'Set in Fraunces</div>' +
        '<div class="end-wordmark">BOOK<b>.</b></div>';
      var rb = document.createElement('button');
      rb.className = 'replay'; rb.type = 'button'; rb.textContent = 'Replay';
      rb.addEventListener('click', function () { if (ctx.player) ctx.player.showCard(0); });
      el.appendChild(rb);
    }
    else if (t === 'gallery') {
      el = document.createElement('div');
      el.className = 'cmp-gallery';
      if ((node.b || []).indexOf('vertical-freescroll') !== -1) el.style.scrollSnapType = 'none';
      (node.k || []).forEach(function (item) {
        var it = document.createElement('div');
        it.className = 'cmp-gallery-item';
        if (item.css) {
          applyCss(it, item.css);
          it.style.position = 'relative'; it.style.top = ''; it.style.left = '';
        }
        (item.k || []).forEach(function (ch) { render(ch, it, ctx); });
        el.appendChild(it);
      });
      parent.appendChild(el);
      if ((node.k || []).length > 1) {
        var hint = document.createElement('div');
        hint.className = 'gallery-hint';
        hint.innerHTML = '<svg width="46" height="24" viewBox="0 0 46 24" fill="none"><path d="M4 4 L23 19 L42 4" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        parent.appendChild(hint);
        el.addEventListener('scroll', function () {
          hint.classList.toggle('hidden', el.scrollTop > 60);
        }, { passive: true });
      }
      return;
    }
    else { return; }

    parent.appendChild(el);
    (node.k || []).forEach(function (ch) { render(ch, el, ctx); });
  }

  /* ---------- player factory: flip mechanics (verbatim from wrap.co main.css) ---------- */
  /* opts: { screen, container, prevBtn, nextBtn, pageBar, tapLeft, tapRight,
   *         keyGate()  -> bool   (should arrow keys act right now)
   *         onLoaded(book)       (page hook: set title, chrome, ...) }        */

  function createPlayer(opts) {
    var screenEl = opts.screen, container = opts.container;
    var prevBtn = opts.prevBtn, nextBtn = opts.nextBtn, pageBar = opts.pageBar;
    var cards = [], total = 0, current = 0, animating = false;
    var canvasH = 910;
    var api = {};

    /* Motion system — each behavior rides its own flag so any one can be
     * switched off to refine the others (set window.BOOK_MOTION before
     * the runtime loads to override). */
    var MOTION = global.BOOK_MOTION || { kenBurns: true, settle: true, parallax: true, haptics: true };
    screenEl.classList.toggle('m-kb', !!MOTION.kenBurns);
    screenEl.classList.toggle('m-settle', !!MOTION.settle);
    screenEl.classList.toggle('m-par', !!MOTION.parallax);
    function tick() {
      if (MOTION.haptics && navigator.vibrate) { try { navigator.vibrate(6); } catch (e) {} }
    }

    function rescale() {
      var s = screenEl.clientWidth / 640;
      /* screens taller than the loaded canvas get it centered; the card
       * background fills the rest */
      var top = Math.max(0, (screenEl.clientHeight - canvasH * s) / 2);
      Array.prototype.forEach.call(screenEl.querySelectorAll('.canvas'), function (cv) {
        cv.style.transform = 'scale(' + s + ')';
        cv.style.top = top + 'px';
      });
    }
    if (window.ResizeObserver) new ResizeObserver(rescale).observe(screenEl);
    else window.addEventListener('resize', rescale);

    function update() {
      if (current > 0 && cards[0]) cards[0].classList.remove('animate-swipe-hint');
      cards.forEach(function (c, i) { c.classList.toggle('turned', i < current); });
      pageBar.style.left = (current * 100 / total) + '%';
      prevBtn.hidden = current === 0;
      nextBtn.hidden = current === total - 1;
      /* the current card carries the Ken Burns drift */
      cards.forEach(function (c, i) { c.classList.toggle('current', i === current); });
      /* Chameleon chrome: browsers reserve top/bottom bands (status bar,
       * toolbar) and tint them from theme-color / the page background.
       * Painting both with the current card's color makes the book bleed
       * into them instead of sitting between black bars. */
      var bg = cards[current] && cards[current].style.background;
      if (bg) {
        var stage = screenEl.parentElement;
        if (stage) stage.style.background = bg;
        document.body.style.background = bg;
        document.documentElement.style.background = bg;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', bg);
      }
      if (opts.onPage) opts.onPage(current, total);
    }

    function go(dir) {
      if (animating) return;
      var next = current + dir;
      if (next < 0 || next >= total) return;
      animating = true; current = next; tick(); update();
      setTimeout(function () { animating = false; }, 420);
    }

    api.loadBook = function (w) {
      container.innerHTML = '';
      cards = []; current = 0;
      canvasH = w.height || 910;
      /* canvas + gallery-item heights follow the compiled book */
      screenEl.style.setProperty('--canvas-h', canvasH + 'px');
      var ctx = { bookName: w.name, date: w.date, player: api };
      (w.cards || []).forEach(function (cardNode, i) {
        var card = document.createElement('section');
        card.className = 'card';
        card.style.zIndex = String(500 - i);
        var bg = cardNode.bg || (cardNode.css && cardNode.css['background-color']);
        if (bg) card.style.background = bg;
        var canvas = document.createElement('div');
        canvas.className = 'canvas';
        (cardNode.k || []).forEach(function (ch) { render(ch, canvas, ctx); });
        card.appendChild(canvas);
        var fold = document.createElement('div');
        fold.className = 'fold';
        card.appendChild(fold);
        container.appendChild(card);
        cards.push(card);
      });
      total = cards.length;
      pageBar.style.width = (100 / total) + '%';
      rescale();
      /* wrap.co's first-time "flip me" hint, verbatim keyframes in runtime.css */
      cards[0].classList.add('animate-swipe-hint');
      cards[0].addEventListener('animationend', function () {
        cards[0].classList.remove('animate-swipe-hint');
      });
      update();
      if (opts.onLoaded) opts.onLoaded(w);
    };
    api.go = go;
    api.showCard = function (i) { current = Math.max(0, Math.min(total - 1, i)); update(); };
    api.cardCount = function () { return total; };

    nextBtn.addEventListener('click', function () { go(1); });

  /* opts.height: the logical canvas height (default the classic 910).

  var SYSTEM_PROMPT = ([
  "You are a story designer for BOOK, a mobile flip-book format: a phone-sized stack of full-screen cards the reader swipes through.",
  "Given a story idea, compose a book of 5 to 8 cards using these card types:",
  "- cover: the opening card. title (2-4 words, evocative) + kicker (a one-line subtitle). Always first.",
  "- prose: a narrative beat. kicker (optional small line), title (2-5 words), body (2-4 sentences, warm and concrete).",
  "- quote: a poem, letter excerpt, or meaningful quotation. lines (each line short), attribution (optional). Use at most once.",
  "- product: something offered or celebrated, with a call to action. title, body, optional price (like \"$18\"), button (2-3 words), url (real if given or verified, else null).",

  "- Only attribute a quotation to a real person if it is genuinely theirs. Otherwise attribute it to someone in the story, or leave attribution null.",
  "",
  "Pictures are rationed, not routine: the cover always has an image, and beyond it give photographs only to the two or three strongest moments of the book. Every other card sets image to null and becomes a type-only page - its words set large on deep ink. The quote is almost always strongest as pure typography. A photograph on every page reads like a catalog; the alternation of photo pages and ink pages is the book's rhythm. When a card does carry an image, its label is the brief a photographer would shoot from: 4-8 concrete words naming subject, setting, and light or time of day (e.g. \"weathered lighthouse on a cliff at dusk\", \"flour-dusted hands shaping dough, morning window light\"). Photographable things only - no abstractions, no emotions as subjects, no readable text or signage, no real people's names or likenesses. h1 and h2 are HSL hues 0-359 evoking the scene (the renderer shows a solid ink tone in that hue until the photo arrives - warm 10-50, golden 40-60, green 90-150, teal 170-200, blue 200-250, violet 250-290, rose 300-340).",
  "",
  "Art direction: every card (except map) sets layout = {band, align, scale} to place its type on the page. band: \"top\", \"middle\", or \"bottom\" - where the text block sits over the photo (write the image label so its calm negative space falls in that band). align: \"center\" or \"left\". scale: \"quiet\", \"standard\", or \"loud\" - how large the title speaks. Let the copy motivate the choice: a short declarative line earns loud; a long or tender passage sets quiet or standard, left-aligned, top or bottom; a held-breath moment sits middle center. Rhythm rules for the whole book: direct every card explicitly rather than leaving layout null; no two consecutive cards may repeat the same band+align pair; use at least two different bands and at least one left-aligned page; at most one loud page besides the cover. A well-varied six-card book might run: cover bottom/center/loud → prose top/left/standard → prose bottom/left/quiet → quote middle/center/quiet → product bottom/center/standard → map.",

  "",

  "Voice - write like an author, not a brochure. Banned words and moves: nestled, vibrant, tapestry, testament, bustling, delve, journey (as metaphor), \"little did they know\", opening every card with \"The\". The book's first line must hook; the last card lands on a beat, not a summary. Read lines aloud in your head - if it sounds like ad copy, rewrite it. Use typographic punctuation: real em dashes (—) and curly apostrophes.",

<script>
(function () {
  'use strict';

  var apiFetch = BookChrome.apiFetch;

  /* ---------- the story being written ---------- */
  var STARTER = {
    name: 'Untitled',
    style: null,
    cards: [
      { type: 'cover', kicker: 'Written by hand', title: 'A New Book',
        image: { h1: 220, h2: 260, label: 'evening light over a quiet street' }, layout: null },
      { type: 'prose', kicker: null, title: 'First Page',
        body: 'Begin here — a few warm sentences carry a page.', image: null, layout: null }
    ]
  };

  /* The editor assumes story.cards maps 1:1 onto compiled pages, but the
   * compiler flattens legacy gallery cards into one page per moment —
   * so flatten them here too before anything renders or edits. */
  function flattenGalleries(s) {
    var out = [];
    ((s && s.cards) || []).forEach(function (c) {
      if (c && c.type === 'gallery') {
        (c.items || []).slice(0, 5).forEach(function (it) {
          it = it || {};
          out.push({ type: 'prose', kicker: it.kicker || null, title: it.title || null,
            body: it.body || null, image: it.image || null, layout: null });
        });
      } else if (c) out.push(c);
    });
    s.cards = out;
    return s;
  }

  var story = null;
  var fromHandoff = false;
  try {
    var handed = sessionStorage.getItem('book.edit');
    if (handed) {
      story = JSON.parse(handed);
      sessionStorage.removeItem('book.edit');
      fromHandoff = true;
    }
  } catch (e) {}
  if (!story) {
    try { var draft = localStorage.getItem('book.editor.draft'); if (draft) story = JSON.parse(draft); } catch (e) {}
  }
  if (!story || !Array.isArray(story.cards) || !story.cards.length) story = JSON.parse(JSON.stringify(STARTER));
  flattenGalleries(story);

  var sel = 0; /* selected story-card index */
  var lastShareId = null;

  /* ---------- field vocabulary per card type ---------- */
  var TYPES = ['prose', 'quote', 'product', 'video', 'map'];
  var TYPE_NAMES = { cover: 'Cover', prose: 'Prose', quote: 'Quote', product: 'Product', video: 'Video', map: 'Map' };
  var FIELDS = {
    cover:   ['kicker', 'title'],
    prose:   ['kicker', 'title', 'body'],
    quote:   ['title', 'lines', 'attribution'],
    product: ['kicker', 'title', 'body', 'price', 'button', 'url'],
    video:   ['title', 'body', 'url'],
    map:     ['title', 'address']
  };
  var LABELS = {
    kicker: 'Kicker', title: 'Title', body: 'Body', lines: 'Lines — one per line',
    attribution: 'Attribution', price: 'Price', button: 'Button label', url: 'Link URL', address: 'Address or place'
  };
  var AREAS = { body: 1, lines: 1 };
  /* mirror the API's LIMITS (api/src/lib/story.js) — the server silently
   * truncates past these, so the editor must stop typing at the line */
  var MAXLEN = { kicker: 120, title: 160, body: 1000, lines: 3400, attribution: 120,
    price: 40, button: 60, url: 500, address: 250, imageLabel: 120, style: 200 };
  var NO_IMAGE = { map: 1 };   /* map draws its own page */
  var NO_LAYOUT = { map: 1 };
  var BLANK = {
    prose:   { type: 'prose', kicker: null, title: 'New Page', body: 'Write the moment…', image: null, layout: null },
    quote:   { type: 'quote', title: null, lines: ['A line worth keeping.'], attribution: null, image: null, layout: null },
    product: { type: 'product', kicker: null, title: 'Something Offered', body: 'What it is and why it matters.', price: null, button: 'Learn more', url: null, image: { h1: 40, h2: 70, label: 'the thing itself, soft daylight' }, layout: null },
    video:   { type: 'video', title: 'Watch', body: null, url: null, image: { h1: 220, h2: 260, label: 'a paused moment from the film' }, layout: null },
    map:     { type: 'map', title: 'VISIT US', address: '' }
  };

  /* ---------- rendering: real compiler, real renderer ---------- */
  function compiled() {
    return BookCompiler.compileBook(story, { height: 910 });
  }
  function renderCardInto(el, node, scale) {
    el.innerHTML = '';
    el.style.background = node.bg || '#000';
    var canvas = document.createElement('div');
    canvas.className = 'canvas';
    canvas.style.transform = 'scale(' + scale + ')';
    var ctx = { bookName: story.name, date: null, player: null };
    (node.k || []).forEach(function (ch) { BookRuntime.render(ch, canvas, ctx); });
    el.appendChild(canvas);
  }

  var rail = document.getElementById('cardRail');
  var stageCard = document.getElementById('stageCard');
  var panel = document.getElementById('panel');

  function renderRail() {
    var book = compiled();
    rail.innerHTML = '';
    story.cards.forEach(function (c, i) {
      var t = document.createElement('button');
      t.className = 'ed-thumb' + (i === sel ? ' sel' : '');

      t.title = TYPE_NAMES[c.type] || c.type;
      t.setAttribute('aria-label', 'Page ' + (i + 1) + ' — ' + (TYPE_NAMES[c.type] || c.type));

      renderCardInto(t, book.cards[i], 58 / 640);
      var lb = document.createElement('span');
      lb.className = 't-label';
      lb.textContent = i === 0 ? 'cover' : (TYPE_NAMES[c.type] || '').toLowerCase();
      t.appendChild(lb);
      t.addEventListener('click', function () { select(i); });
      rail.appendChild(t);
    });
    /* the colophon, always appended — shown so the shape of the book is honest */
    var end = document.createElement('button');
    end.className = 'ed-thumb' + (sel === story.cards.length ? ' sel' : '');
    renderCardInto(end, book.cards[book.cards.length - 1], 58 / 640);
    var elb = document.createElement('span');
    elb.className = 't-label'; elb.textContent = 'end';
    end.appendChild(elb);
    end.addEventListener('click', function () { select(story.cards.length); });
    rail.appendChild(end);

    var add = document.createElement('button');
    add.className = 'ed-add'; add.id = 'addCard'; add.textContent = '＋';
    add.title = 'Add a page';
    add.addEventListener('click', openTypeMenu);
    rail.appendChild(add);
  }

  var peekCard = document.getElementById('peekCard');
  function renderStage() {
    /* never mid-edit: a re-render would tear the caret out from under
     * the writer — the blur handler re-renders when they're done */
    if (stageCard.querySelector('[contenteditable]')) return;
    var book = compiled();
    var node = book.cards[Math.min(sel, book.cards.length - 1)];
    var w = stageCard.clientWidth || 320;

    if (peekCard.offsetWidth) renderCardInto(peekCard, node, peekCard.offsetWidth / 640);
  }

  /* ---------- direct manipulation on the stage ----------
   * Text on the preview card edits in place (contenteditable, synced
   * back into the story); pictures, buttons, links, and composite text
   * click through to their field in the panel. */

  /* thumbnail + draft only — a full refresh would tear down the
   * contenteditable mid-keystroke */
  var thumbTimer = null;
  function refreshThumb() {
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(function () {
      var book = compiled();
      var thumb = rail.querySelector('[data-idx="' + sel + '"]');
      if (thumb) {
        var keep = thumb.querySelector('.t-label');

      }

        var node = book.cards[Math.min(sel, book.cards.length - 1)];

  }

  function focusField(key) {
    var input = panel.querySelector('[data-key="' + key + '"]');

    input.classList.add('flash');

  /* fields simple enough to edit right on the card — everything else
   * (quote lines with attribution, product body with price) round-trips
   * through the panel where the parts stay separate */
  function inlineEditable(c, f) {
    if (f === 'title' || f === 'kicker') return true;
    return f === 'body' && (c.type === 'prose' || c.type === 'video');
  }

  function startInline(el, f) {
    if (!stageCard.contains(el)) {
      el = stageCard.querySelector('[data-f="' + f + '"]');
      if (!el) return;
    }
    var c = story.cards[sel];
    el.contentEditable = 'plaintext-only';
    if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true';
    /* show the raw text while editing — smartening returns on blur */
    el.textContent = c[f] == null ? '' : c[f];
    el.focus();
    var r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    var s = getSelection();
    s.removeAllRanges();
    s.addRange(r);

    function onInput() {
      var v = el.textContent;
      c[f] = v.trim().length ? v : null;
      var input = panel.querySelector('[data-key="' + f + '"]');
      if (input) input.value = v; /* mirror without re-rendering */
      refreshThumb();
    }
    function onKey(e) {
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); el.blur(); }
    }
    function onBlur() {
      el.removeEventListener('input', onInput);
      el.removeEventListener('keydown', onKey);
      el.removeEventListener('blur', onBlur);
      el.removeAttribute('contenteditable');
      refreshSoon(false); /* proper typography comes back */
    }
    el.addEventListener('input', onInput);
    el.addEventListener('keydown', onKey);
    el.addEventListener('blur', onBlur);
  }

  stageCard.addEventListener('click', function (e) {
    if (sel >= story.cards.length) return; /* the colophon sets itself */
    e.preventDefault();
    var c = story.cards[sel];
    var t = e.target.closest('[data-f]');
    if (t) {
      var f = t.getAttribute('data-f');
      if (t.hasAttribute('contenteditable')) return; /* already editing */
      if (inlineEditable(c, f)) return startInline(t, f);
      return focusField(f);
    }
    if (e.target.closest('.cmp-youtube') || e.target.closest('.cmp-action')) return focusField('url');
    if (e.target.closest('.cmp-map')) return focusField('address');
    if (e.target.closest('.cmp-image')) return focusField('imageLabel');
  });

  /* refresh scopes: text edits touch one card; structure redraws everything */
  var refreshTimer = null;
  function refreshSoon(structural) {
    clearTimeout(refreshTimer);
    refreshTimer = setTimeout(function () {
      if (structural) renderRail();
      else {
        var book = compiled();
        var thumb = rail.querySelector('[data-idx="' + sel + '"]');
        if (thumb) {
          var keep = thumb.querySelector('.t-label');
          renderCardInto(thumb, book.cards[sel], 58 / 640);
          if (keep) thumb.appendChild(keep);
        }
      }
      renderStage();
      saveDraft();
    }, 180);
  }

  /* ---------- the fields panel ---------- */
  var fieldSeq = 0;
  function field(labelText, value, opts) {
    var wrap = document.createElement('div');
    wrap.className = 'ed-field';
    var lb = document.createElement('label');
    lb.className = 'ed-label';
    lb.textContent = labelText;
    wrap.appendChild(lb);
    var input = document.createElement(opts && opts.area ? 'textarea' : 'input');
    if (!(opts && opts.area)) input.type = 'text';
    input.id = 'edField' + (++fieldSeq);
    lb.htmlFor = input.id;
    if (opts && opts.key) input.setAttribute('data-key', opts.key);
    input.value = value == null ? '' : value;
    if (opts && opts.maxlen) input.maxLength = opts.maxlen;
    if (opts && opts.placeholder) input.placeholder = opts.placeholder;
    wrap.appendChild(input);
    if (opts && opts.hint) {
      var h = document.createElement('div');
      h.className = 'ed-hint';
      h.textContent = opts.hint;
      wrap.appendChild(h);
    }
    return { el: wrap, input: input };
  }

  function seg(options, current, onPick) {
    var box = document.createElement('div');
    box.className = 'ed-seg';
    options.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label;
      if (o.value === current) b.classList.add('on');
      b.addEventListener('click', function () {
        onPick(o.value);
        Array.prototype.forEach.call(box.children, function (x) { x.classList.remove('on'); });
        b.classList.add('on');
      });
      box.appendChild(b);
    });
    return box;
  }

  function renderPanel() {
    panel.innerHTML = '';

    if (sel >= story.cards.length) { /* the colophon */
      var note = document.createElement('p');
      note.className = 'ed-note';
      note.textContent = 'The closing page sets itself — your book’s name, when it was told, and the type it was set in.';
      panel.appendChild(note);
      return;
    }

    var c = story.cards[sel];

    /* card bar: title + operations */
    var bar = document.createElement('div');
    bar.className = 'ed-cardbar';
    var ct = document.createElement('div');
    ct.className = 'ed-cardtitle';
    ct.textContent = (sel === 0 ? 'Cover' : 'Page ' + (sel + 1)) + ' — ' + (TYPE_NAMES[c.type] || c.type);
    bar.appendChild(ct);
    function op(txt, title, fn, disabled, danger) {
      var b = document.createElement('button');
      b.className = 'ed-icon' + (danger ? ' danger' : '');
      b.textContent = txt; b.title = title; b.disabled = !!disabled;
      b.addEventListener('click', fn);
      bar.appendChild(b);
    }
    op('◀', 'Move left', function () { move(-1); }, sel <= 1);
    op('▶', 'Move right', function () { move(1); }, sel === 0 || sel >= story.cards.length - 1);
    op('⧉', 'Duplicate', function () { duplicate(); }, sel === 0);
    op('✕', 'Delete page', function () { remove(); }, sel === 0, true);
    panel.appendChild(bar);

    /* text fields for this card type */
    (FIELDS[c.type] || []).forEach(function (key) {
      var value = key === 'lines' ? (c.lines || []).join('\n') : c[key];
      var f = field(LABELS[key], value, { area: AREAS[key], maxlen: MAXLEN[key], key: key });
      f.input.addEventListener('input', function () {
        var v = f.input.value;
        if (key === 'lines') c.lines = v.split('\n').map(function (s) { return s; }).filter(function (s) { return s.trim().length; });
        else c[key] = v.trim().length ? v : null;
        refreshSoon(false);
      });
      panel.appendChild(f.el);
    });

    /* image: photograph or ink page */
    if (!NO_IMAGE[c.type]) {
      var sec = document.createElement('div');
      sec.className = 'ed-section';
      var slb = document.createElement('div');
      slb.className = 'ed-label'; slb.textContent = 'Picture';
      sec.appendChild(slb);
      sec.appendChild(seg(
        [{ label: 'Photograph', value: 'photo' }, { label: 'Ink page — type only', value: 'ink' }],
        c.image ? 'photo' : 'ink',
        function (v) {
          if (v === 'ink') c.image = null;
          else if (!c.image) c.image = { h1: 220, h2: 260, label: '' };
          renderPanel();
          refreshSoon(false);
        }
      ));
      if (c.image) {
        var gap = document.createElement('div'); gap.style.height = '14px'; sec.appendChild(gap);
        if (c.image.url) {
          var row = document.createElement('div');
          row.style.cssText = 'display:flex; gap:12px; align-items:center; margin-bottom:12px;';
          var im = document.createElement('img');
          im.className = 'ed-photothumb';
          im.src = BookRuntime.imageSrc(c.image.url) || '';
          im.alt = '';
          row.appendChild(im);
          var nt = document.createElement('div');
          nt.className = 'ed-hint';
          nt.textContent = 'Already painted. Changing the scene clears it, and it repaints when you share.';
          row.appendChild(nt);
          sec.appendChild(row);
        }
        var lf = field('Scene — what the photograph shows', c.image.label, {
          placeholder: 'weathered lighthouse on a cliff at dusk', maxlen: MAXLEN.imageLabel, key: 'imageLabel',
          hint: 'Brief a photographer: subject, setting, light. No names, no readable text.'
        });
        lf.input.addEventListener('input', function () {
          c.image.label = lf.input.value;
          if (c.image.url) { delete c.image.url; renderPanel(); }
          refreshSoon(false);
        });
        sec.appendChild(lf.el);
        var hueWrap = document.createElement('div');
        hueWrap.className = 'ed-field';
        var hlb = document.createElement('label');
        hlb.className = 'ed-label'; hlb.textContent = 'Mood hue — the page’s color before the photo lands';
        hueWrap.appendChild(hlb);
        var hrow = document.createElement('div');
        hrow.className = 'ed-huerow';
        var sw = document.createElement('div');
        sw.className = 'ed-swatch';
        sw.style.background = 'hsl(' + (c.image.h1 || 0) + ', 50%, 40%)';
        var range = document.createElement('input');
        range.type = 'range'; range.min = '0'; range.max = '359'; range.value = String(c.image.h1 || 0);
        range.addEventListener('input', function () {
          c.image.h1 = Number(range.value);
          c.image.h2 = (c.image.h1 + 40) % 360;
          sw.style.background = 'hsl(' + c.image.h1 + ', 50%, 40%)';
          refreshSoon(false);
        });
        hrow.appendChild(sw); hrow.appendChild(range);
        hueWrap.appendChild(hrow);
        sec.appendChild(hueWrap);
      }
      panel.appendChild(sec);
    }

    /* art direction */
    if (!NO_LAYOUT[c.type]) {
      var lay = document.createElement('div');
      lay.className = 'ed-section';
      var L = c.layout || {};
      function pickLayout(k, v) {
        var cur = c.layout || {};
        var next = { band: cur.band || null, align: cur.align || null, scale: cur.scale || null };
        next[k] = v;
        c.layout = (next.band || next.align || next.scale) ? next : null;
        refreshSoon(false);
      }
      var l1 = document.createElement('div'); l1.className = 'ed-label'; l1.textContent = 'Type placement';
      lay.appendChild(l1);
      lay.appendChild(seg([
        { label: 'Auto', value: null }, { label: 'Top', value: 'top' }, { label: 'Middle', value: 'middle' }, { label: 'Bottom', value: 'bottom' }
      ], L.band || null, function (v) { pickLayout('band', v); }));
      var g1 = document.createElement('div'); g1.style.height = '12px'; lay.appendChild(g1);
      lay.appendChild(seg([
        { label: 'Auto', value: null }, { label: 'Centered', value: 'center' }, { label: 'Left', value: 'left' }
      ], L.align || null, function (v) { pickLayout('align', v); }));
      var g2 = document.createElement('div'); g2.style.height = '12px'; lay.appendChild(g2);
      lay.appendChild(seg([
        { label: 'Auto', value: null }, { label: 'Quiet', value: 'quiet' }, { label: 'Standard', value: 'standard' }, { label: 'Loud', value: 'loud' }
      ], L.scale || null, function (v) { pickLayout('scale', v); }));
      panel.appendChild(lay);
    }

    /* book-level style, always at hand */
    var bsec = document.createElement('div');
    bsec.className = 'ed-section';
    var bf = field('Book — photographic style for every picture', story.style, {
      placeholder: 'muted 35mm film, overcast coastal light, quiet distances', maxlen: MAXLEN.style,
      hint: 'One art-direction line shared by all the book’s photographs.'
    });
    bf.input.addEventListener('input', function () {
      story.style = bf.input.value.trim().length ? bf.input.value : null;
      markDirty();
    });
    bsec.appendChild(bf.el);
    panel.appendChild(bsec);
  }

  /* ---------- card operations ---------- */
  function select(i) {
    sel = i;
    renderRail();
    renderPanel();
    renderStage();
  }
  function move(dir) {
    var j = sel + dir;
    if (sel === 0 || j <= 0 || j >= story.cards.length) return;
    var c = story.cards.splice(sel, 1)[0];
    story.cards.splice(j, 0, c);
    sel = j;
    select(sel);
    saveDraft();
  }
  function duplicate() {
    if (story.cards.length >= 12) return toast('A book holds at most 12 pages.');
    var copy = JSON.parse(JSON.stringify(story.cards[sel]));
    if (copy.image) delete copy.image.url; /* the copy paints its own picture */
    story.cards.splice(sel + 1, 0, copy);
    select(sel + 1);
    saveDraft();
  }
  var lastDeleted = null;
  function remove() {
    if (sel === 0) return;
    lastDeleted = { card: story.cards[sel], at: sel };
    story.cards.splice(sel, 1);
    select(Math.min(sel, story.cards.length - 1));
    saveDraft();
    toast('Page deleted — <button type="button" id="undoDelete">Undo</button>');
  }

  var typeMenu = document.getElementById('typeMenu');
  function openTypeMenu(e) {
    typeMenu.innerHTML = '';
    TYPES.forEach(function (t) {
      var b = document.createElement('button');
      b.textContent = TYPE_NAMES[t];
      b.addEventListener('click', function () {
        typeMenu.hidden = true;
        if (story.cards.length >= 12) return toast('A book holds at most 12 pages.');
        story.cards.push(JSON.parse(JSON.stringify(BLANK[t])));
        select(story.cards.length - 1);
        saveDraft();
      });
      typeMenu.appendChild(b);
    });
    var r = e.currentTarget.getBoundingClientRect();
    typeMenu.style.left = Math.min(r.left, window.innerWidth - 170) + 'px';
    typeMenu.style.top = (r.bottom + 6) + 'px';
    typeMenu.hidden = false;
    e.stopPropagation();
  }
  document.addEventListener('click', function (e) {
    if (!typeMenu.hidden && !typeMenu.contains(e.target)) typeMenu.hidden = true;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !typeMenu.hidden) typeMenu.hidden = true;
  });

  /* ---------- name + draft persistence ---------- */
  var nameInput = document.getElementById('bookName');
  var saveState = document.getElementById('saveState');
  nameInput.value = story.name || '';
  nameInput.addEventListener('input', function () {
    story.name = nameInput.value.trim().length ? nameInput.value : 'Untitled';
    refreshSoon(false); /* the colophon carries the name */
  });

  var dirty = false;
  function markDirty() { dirty = true; saveDraft(); }
  var draftTimer = null;
  function saveDraft() {
    lastShareId = null; /* edits after a share need a fresh share */
    clearTimeout(draftTimer);
    draftTimer = setTimeout(function () {
      try {
        localStorage.setItem('book.editor.draft', JSON.stringify(story));
        saveState.textContent = 'Draft saved';
      } catch (e) {}
    }, 400);
  }

  /* ---------- full-book preview ---------- */
  var overlay = document.getElementById('previewOverlay');
  var pvPlayer = null;
  function showPreview() {
    if (!pvPlayer) {
      pvPlayer = BookRuntime.createPlayer({
        screen: document.getElementById('pvScreen'),
        container: document.getElementById('pvCards'),
        prevBtn: document.getElementById('pvPrev'),
        nextBtn: document.getElementById('pvNext'),
        pageBar: document.getElementById('pvBar'),
        tapLeft: document.getElementById('pvTapL'),
        tapRight: document.getElementById('pvTapR'),
        keyGate: function () { return !overlay.hidden; },
        dragGate: function () { return !overlay.hidden; }
      });
    }
    overlay.hidden = false;
    pvPlayer.loadBook(BookCompiler.compileBook(story, { height: 910, date: new Date().toISOString() }));
    /* open on the page being edited, not the cover */
    pvPlayer.showCard(Math.min(sel, pvPlayer.cardCount() - 1));
  }
  document.getElementById('previewBtn').addEventListener('click', showPreview);
  peekCard.addEventListener('click', showPreview);
  document.getElementById('pvClose').addEventListener('click', function () { overlay.hidden = true; });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !overlay.hidden) overlay.hidden = true;
  });

  /* ---------- share: store, then paint the pictures ---------- */
  var shareToast = document.getElementById('shareToast');
  var toast = BookChrome.toaster(shareToast);

  function setImageNote(text) {
    var note = document.getElementById('imgNote');
    if (note) { if (text) note.textContent = text; else note.remove(); }
  }

  /* same shape as the composer's fan-out: sequential, honest about the
   * outcome, tolerant of a severed connection (the server may finish
   * painting after the response is cut — opening the link collects it) */
  async function fanOutImages(id, slots) {
    var landed = 0, firstErr = null, netFails = 0;
    for (var i = 0; i < (slots || []).length; i++) {
      if (lastShareId !== id) return; // edited since — a newer share owns the pictures
      var res;
      try {
        res = await apiFetch('/api/books/' + encodeURIComponent(id) + '/images', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ slot: slots[i] }),
          keepalive: true
        });
      } catch (e) {
        if (++netFails >= 2) { setImageNote(null); return; }
        if (!firstErr) firstErr = 'connection dropped';
        continue;
      }
      netFails = 0;
      if (res.status === 503 || res.status === 429) { setImageNote(null); return; }
      if (!res.ok) {
        if (!firstErr) {
          try { firstErr = (await res.json() || {}).error; } catch (e) {}
          firstErr = firstErr || 'HTTP ' + res.status;
        }
        continue;
      }
      landed += 1;
    }
    if (landed === (slots || []).length) setImageNote('The pictures are in — open the link.');
    else if (landed) setImageNote('Some pictures didn’t finish — opening the book link retries them.');
    else setImageNote('The pictures didn’t paint' + (firstErr ? ' (' + firstErr + ')' : '') + ' — opening the book link retries them.');
  }

  var shareBtn = document.getElementById('shareBtn');
  shareBtn.addEventListener('click', async function () {
    if (lastShareId) { /* unchanged since the last share — same link */
      toast('This book lives at <a href="/b/' + lastShareId + '" target="_blank" rel="noopener noreferrer">' +
        location.origin + '/b/' + lastShareId + '</a>', true);
      return;
    }
    shareBtn.disabled = true;
    shareBtn.textContent = 'Sharing…';
    try {
      var res = await fetch('/api/books', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ story: story })
      });
      var data = null;
      try { data = await res.json(); } catch (e) {}
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      lastShareId = data.id;
      var link = location.origin + '/b/' + data.id;
      var copied = false;
      try { await navigator.clipboard.writeText(link); copied = true; } catch (e) {}
      if ((data.imageSlots || []).length) fanOutImages(data.id, data.imageSlots);
      toast((copied ? 'Link copied — ' : 'Your book: ') +
        '<a href="' + link + '" target="_blank" rel="noopener noreferrer">' + link + '</a>' +
        '<button type="button" id="galleryBtn">Add to the library</button>' +
        ((data.imageSlots || []).length ? '<br><span id="imgNote">Painting the pictures — open the link to watch them land.</span>' : ''),
        true);
      saveState.textContent = 'Shared';
    } catch (e) {
      toast('Sharing isn’t available here' + (e && e.message ? ' (' + BookRuntime.escapeHtml(e.message) + ')' : '') + ' — it needs the hosted API.');
    } finally {
      shareBtn.disabled = false;
      shareBtn.textContent = 'Share';
    }
  });

  /* wipe the share id whenever the story mutates (all paths call saveDraft) */

  /* ---------- boot ---------- */
  if (fromHandoff) {
    saveState.textContent = 'Editing your book';
    /* a handoff must not silently destroy an in-progress draft: park the
     * old draft under a backup key and offer the way back */
    try {
      var prevDraft = localStorage.getItem('book.editor.draft');
      if (prevDraft && prevDraft !== JSON.stringify(story)) {
        localStorage.setItem('book.editor.draft.backup', prevDraft);
        var prevName = 'Untitled';
        try { prevName = JSON.parse(prevDraft).name || 'Untitled'; } catch (e2) {}
        toast('Your draft “' + BookRuntime.escapeHtml(prevName) + '” is set aside. ' +
          '<button type="button" id="restoreDraft">Open it instead</button>', true);
      }
    } catch (e) {}
  }
  /* undo a page deletion — one step, straight back where it was */
  shareToast.addEventListener('click', function (e) {
    if (!e.target.closest('#undoDelete') || !lastDeleted) return;
    if (story.cards.length >= 12) { toast('A book holds at most 12 pages.'); return; }
    var at = Math.min(lastDeleted.at, story.cards.length);
    story.cards.splice(at, 0, lastDeleted.card);
    lastDeleted = null;
    shareToast.hidden = true;
    select(at);
    saveDraft();
  });

  /* the shared book can go straight onto the public shelf, like the composer's */
  shareToast.addEventListener('click', async function (e) {
    var gb = e.target.closest('#galleryBtn');
    if (!gb || !lastShareId) return;
    gb.disabled = true;
    gb.textContent = 'Adding…';
    try {
      var res = await fetch('/api/books/' + encodeURIComponent(lastShareId) + '/publish', { method: 'POST' });
      var data = null;
      try { data = await res.json(); } catch (err) {}
      if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
      gb.textContent = 'On the shelf ✓';
    } catch (err) {
      gb.disabled = false;
      gb.textContent = 'Add to the library';
      toast('Couldn’t add it to the library' + (err && err.message ? ': ' + BookRuntime.escapeHtml(err.message) : ''));
    }
  });

  shareToast.addEventListener('click', function (e) {
    if (!e.target.closest('#restoreDraft')) return;
    try {
      var backup = localStorage.getItem('book.editor.draft.backup');
      if (!backup) return;
      story = flattenGalleries(JSON.parse(backup));
      localStorage.removeItem('book.editor.draft.backup');
      nameInput.value = story.name || '';
      lastShareId = null;
      select(0);
      saveDraft();
      shareToast.hidden = true;
      saveState.textContent = 'Draft restored';
    } catch (err) {}
  });
  select(0);
  window.addEventListener('resize', function () { renderStage(); });
})();
</script>
